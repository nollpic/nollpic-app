<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>랜덤컬러</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;height:100dvh;background:#1a1a2e;color:#fff;transition:background 0.25s ease;}

.header{display:flex;align-items:center;justify-content:space-between;padding:0 1rem;height:52px;flex-shrink:0;background:rgba(0,0,0,0.25);}
.back-btn{background:none;border:none;color:#fff;font-size:1.3rem;font-weight:700;cursor:pointer;padding:0.5rem 0.75rem;}
.header-title{font-size:1rem;font-weight:800;}
.header-spacer{width:52px;}

/* 메인 디스플레이 */
.stage{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;overflow:hidden;}
#mainDisplay{flex:1;display:flex;align-items:center;justify-content:center;}

.color-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.color-die{width:min(62vw,280px);aspect-ratio:1;border-radius:22%;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;padding:15%;box-shadow:inset 0 4px 0 rgba(255,255,255,.2), inset 0 -12px 0 rgba(0,0,0,.12), 0 22px 34px rgba(0,0,0,.28);}
.rolling-dots{grid-column:1 / 4;grid-row:2;display:flex;align-items:center;justify-content:center;gap:11%;width:100%;}
.rolling-dots span{width:18%;aspect-ratio:1;border-radius:50%;background:#28324a;opacity:.22;animation:loadingDot .9s ease-in-out infinite;}
.rolling-dots span:nth-child(2){animation-delay:.15s}.rolling-dots span:nth-child(3){animation-delay:.3s}
@keyframes loadingDot{0%,100%{transform:scale(.78);opacity:.22}45%{transform:scale(1);opacity:.82}}
.pip{width:32%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.2);box-shadow:inset 0 2px 2px rgba(0,0,0,.12);}
.pip:nth-child(1){grid-area:1 / 1}.pip:nth-child(2){grid-area:1 / 3}.pip:nth-child(3){grid-area:2 / 2}.pip:nth-child(4){grid-area:3 / 1}.pip:nth-child(5){grid-area:3 / 3}
.color-name{margin-top:1.5rem;font-size:1.55rem;font-weight:900;text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.22);}

.idle-msg{font-size:1rem;color:rgba(255,255,255,0.35);font-weight:600;text-align:center;line-height:1.9;}

/* ── 색상 선택 패널 ── */
.color-picker-panel{
  flex-shrink:0;
  padding:10px 1.25rem 4px;
  background:rgb(0 0 0 / 75%);
  border-top:1px solid rgba(255,255,255,0.08);
}
.picker-label{
  font-size:0.72rem;font-weight:700;color:#cfcfcf;
  margin-bottom:8px;letter-spacing:0.04em;
}
.color-chips{
  display:flex;flex-wrap:wrap;gap:8px;
  padding-bottom:4px;
}
.chip {
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 9px 5px 7px;
  border-radius:999px;
  border:2px solid rgba(255,255,255,0.15); /* 비활성화 테두리 유지 */
  cursor:pointer;
  transition:all 0.15s;
  opacity:0.7;
  background:rgba(0,0,0,0.15);
  user-select:none;
  color:#fff;
}
.chip.on {
  opacity:1;
  border-color:rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.12);
  /* color는 따로 지정하지 않아도 항상 흰색 유지 */
}
.chip-dot{
  width:16px;height:16px;border-radius:50%;
  flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.chip-name {
  font-size:0.78rem;
  font-weight:700;
  color:#fff; /* 항상 흰색 */
}

/* ── 하단 버튼 ── */
.bottom-bar{flex-shrink:0;padding:8px 1.25rem 16px;display:flex;flex-direction:column;gap:8px;}
.stop-btn{
  width:100%;padding:0.95rem;background:#e74c3c;border:none;border-radius:1rem;
  color:#fff;font-size:1.05rem;font-weight:900;cursor:pointer;
  box-shadow:0 4px 20px rgba(231,76,60,0.4);transition:transform 0.1s;display:none;
}
.stop-btn:active{transform:scale(0.97);}
.start-btn{
  width:100%;padding:0.95rem;background:#E8532A;border:none;border-radius:1rem;
  color:#fff;font-size:1.05rem;font-weight:900;cursor:pointer;
  box-shadow:0 4px 20px rgba(232,83,42,0.4);transition:transform 0.1s;
}
.start-btn:active{transform:scale(0.97);}
.count-btn{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,0.12);border:none;color:#fff;
  font-size:1.1rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.12s;flex-shrink:0;
}
.count-btn:active{background:rgba(255,255,255,0.28);}
.none-warn{
  font-size:0.75rem;text-align:center;color:#e74c3c;font-weight:700;
  display:none;animation:shake 0.3s ease;
}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
</style>
    <link rel="stylesheet" href="../button-motion.css?v=20261008-1">

</head>
<body>

<header class="header">
  <button class="back-btn" onclick="goBack()">❮</button>
  <span class="header-title">🎨 랜덤컬러</span>
  <div class="header-spacer"></div>
</header>

<div class="stage" id="stage">
  <div id="mainDisplay">
    <div class="color-wrap">
      <p class="idle-msg">색을 선택하고 시작하면<br>자동으로 멈춰요</p>
    </div>
  </div>
</div>

<!-- 색상 선택 칩 -->
<div class="color-picker-panel">
  <div class="picker-label">포함할 색상 선택</div>
  <div class="color-chips" id="colorChips"></div>
</div>

<div class="bottom-bar">
  <div class="none-warn" id="noneWarn">⚠ 색상을 1개 이상 선택해주세요</div>
  <button class="start-btn" id="startBtn" onclick="startColor()">시작하기</button>
</div>

<script>
const ALL_COLORS = [
  { name:'주황',  bg:'#f16b35', text:'#fff' },
  { name:'노랑',  bg:'#F1C40F', text:'#333' },
  { name:'초록',  bg:'#0c9747', text:'#fff' },
  { name:'파랑',  bg:'#095eff', text:'#fff' },
  { name:'보라',  bg:'#8E44AD', text:'#fff' },
  { name:'핑크',  bg:'#E84393', text:'#fff' },
];

// 기본 활성화 (전체 ON)
const enabled = new Set();

let colorTimer = null;
let autoStopTimer = null;
let isRunning  = false;
let lastIdx    = -1;
let finalColor = null;

// ── 칩 렌더링 ─────────────────────────────────────
function renderChips(){
  const wrap = document.getElementById('colorChips');
  wrap.innerHTML = '';
  ALL_COLORS.forEach((c,i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (enabled.has(i) ? ' on' : '');
    chip.innerHTML = `<div class="chip-dot" style="background:${c.bg};"></div><span class="chip-name">${c.name}</span>`;
    chip.onclick = ()=> toggleChip(i);
    wrap.appendChild(chip);
  });
}

function toggleChip(i){
  if(isRunning) return; // 실행 중엔 변경 불가
  if(enabled.has(i)){
    // 마지막 1개는 끄지 못함
    if(enabled.size <= 1){ showWarn(); return; }
    enabled.delete(i);
  } else {
    enabled.add(i);
  }
  renderChips();
  hideWarn();
}

function showWarn(){
  const w = document.getElementById('noneWarn');
  w.style.display='block';
  w.style.animation='none'; void w.offsetWidth; w.style.animation='shake 0.3s ease';
}
function hideWarn(){ document.getElementById('noneWarn').style.display='none'; }

// ── 오디오 ────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function getACtx(){ if(!actx) actx = new AudioCtx(); return actx; }

function playPop(){
  const ctx=getACtx();
  const osc=ctx.createOscillator(); const g=ctx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(880,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.1);
  g.gain.setValueAtTime(0.2,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+0.12);
}

function playStopSound(){
  const ctx=getACtx();
  [0,0.1].forEach((t,i)=>{
    const osc=ctx.createOscillator(); const g=ctx.createGain();
    osc.type='sine'; osc.frequency.value=i===0?600:400;
    g.gain.setValueAtTime(0.25,ctx.currentTime+t);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.2);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.2);
  });
}

function playDiceRollSound(duration){
  const ctx=getACtx();
  for(let i=0;i<8;i++){
    const at=ctx.currentTime + 0.05 + (duration / 1000) * (i / 8);
    const buffer=ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.055), ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let j=0;j<data.length;j++) data[j]=(Math.random()*2-1)*Math.exp(-j/(data.length*.22));
    const source=ctx.createBufferSource(), gain=ctx.createGain(), filter=ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=800;
    gain.gain.setValueAtTime(0.22,at); gain.gain.exponentialRampToValueAtTime(0.001,at+0.055);
    source.buffer=buffer; source.connect(filter); filter.connect(gain); gain.connect(ctx.destination); source.start(at);
  }
}

// ── 컬러 로직 ─────────────────────────────────────
function startColor(){
  if(enabled.size === 0){ showWarn(); return; }
  isRunning=true;
  document.getElementById('startBtn').style.display='none';
  hideWarn();
  finalColor=pickColor();
  showRollingDie();
  const rollDuration = 1100;
  autoStopTimer = setTimeout(stopColor, rollDuration);
  playDiceRollSound(rollDuration);
}

function pickColor(){
  const pool = [...enabled];
  // 마지막 인덱스 제외하고 뽑기
  let filtered = pool.filter(i=> i!==lastIdx);
  if(filtered.length===0) filtered=pool;
  const pick = filtered[Math.floor(Math.random()*filtered.length)];
  lastIdx=pick;
  return ALL_COLORS[pick];
}

function showColor(){
  const col=finalColor || pickColor();
  const display=document.getElementById('mainDisplay');
  display.innerHTML='';
  requestAnimationFrame(()=>{
    display.innerHTML=`
      <div class="color-wrap">
        <div class="color-die" style="background:${col.bg};">
          <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
        </div>
        <div class="color-name" style="color:${col.text};">${col.name}</div>
      </div>`;
  });
}

function showRollingDie(){
  document.getElementById('mainDisplay').innerHTML=`
    <div class="color-wrap">
      <div class="color-die" style="background:#f4f7fb;"><div class="rolling-dots"><span></span><span></span><span></span></div></div>
      <div class="color-name" style="color:#fff;">굴리는 중...</div>
    </div>`;
}

function stopColor(){
  if(!isRunning) return;
  isRunning=false;
  if(colorTimer) clearTimeout(colorTimer);
  if(autoStopTimer) clearTimeout(autoStopTimer);
  colorTimer=null; autoStopTimer=null;
  showColor();
  playStopSound();
  document.getElementById('startBtn').style.display='block';
  document.getElementById('startBtn').textContent='다시 시작';
}

function goBack(){ window.parent.postMessage({type:'exitPlay'},'*'); }

// 초기화
renderChips();
</script>
<script src="../sound-settings.js?v=20261010-scroll141"></script>
</body>
</html>
