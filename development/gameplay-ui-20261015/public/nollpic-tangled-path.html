<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>꼬인 길 작전</title><style>html,body{margin:0;height:100%;font-family:Arial,"Malgun Gothic";background:#fff7e8;color:#13234a;overflow:hidden}*{box-sizing:border-box}.app{height:100%;padding:12px;display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:9px}.back{border:0;border-radius:13px;background:#e8f3ff;color:#2874d8;font-size:26px;width:40px;height:40px}.title{flex:1}.title small{color:#4d91e8;font-weight:bold}.title b{display:block;font-size:20px}.stat{background:#13234a;color:white;border-radius:13px;padding:7px 10px;text-align:center;font-size:11px}.stat b{display:block;color:#ffe071;font-size:16px}.mission{text-align:center;font-size:13px;font-weight:bold;color:#5d6881;margin:8px}.bar{height:10px;background:#e6e9ee;border-radius:9px;overflow:hidden}.bar i{display:block;width:3.3%;height:100%;background:#47c99a;transition:.25s}.board{position:relative;flex:1;min-height:300px;margin-top:10px;border:4px solid #13234a;border-radius:24px;background:#fff;overflow:hidden;touch-action:none}.line{position:absolute;height:5px;transform-origin:0 50%;border-radius:4px;pointer-events:none}.bad{background:#ff765d}.good{background:#43cba0}.dot{position:absolute;width:48px;height:48px;margin:-24px;border:4px solid #13234a;border-radius:50%;background:#57aaf5;color:#fff;font-size:19px;font-weight:bold;display:grid;place-items:center;touch-action:none;box-shadow:0 3px #13234a}.feedback{height:28px;text-align:center;font-weight:bold;font-size:13px;padding-top:8px}.modal{position:absolute;inset:0;background:#13234a88;display:grid;place-items:center;padding:22px}.modal.hide{display:none}.card{background:white;border-radius:25px;padding:24px;text-align:center;width:100%;max-width:330px}.card h2{margin:8px}.card p{color:#5d6881;line-height:1.5}.card button{width:100%;height:50px;border:0;border-radius:15px;background:#3b82ed;color:white;font-weight:bold;font-size:15px;margin-top:8px}</style><link rel="stylesheet" href="button-motion.css?v=20261008-1"><link rel="stylesheet" href="fonts/jua/jua.css"><script src="minigames/avatar-adapter.js" defer></script><link rel="stylesheet" href="minigames/game-intro.css"><script src="minigames/game-intro-config.js" defer></script><script src="minigames/game-intro.js" defer></script><script src="minigames/game-intro-boot.js" defer></script><link rel="stylesheet" href="minigames/play-ui.css"><script src="minigames/play-ui.js" defer></script><body><main class="app"><header class="head"><button class="back" onclick="exit()">‹</button><div class="title"><small>18번 오늘의 미션</small><b>꼬인 길 작전</b></div><div class="stat">단계<b id="lv">1 / 30</b></div></header><p class="mission" id="mission"></p><div class="bar"><i id="progress"></i></div><section class="board" id="board"></section><div class="feedback" id="feedback">선을 겹치지 않게 점을 옮겨요.</div></main><section class="modal" id="modal"><div class="card"><div style="font-size:46px">🧭</div><h2 id="mt">꼬인 길 작전</h2><p id="mp">번호 점을 드래그해 선들이 서로 만나지 않게 만들어 볼까요?</p><button id="go">작전 시작</button></div></section><script>
const B=board,M=modal,L=lv,F=feedback,P=progress;const missions=['가장 많이 꼬인 점부터 찾아볼까?','움직이기 전에 어디로 옮길지 먼저 생각해봐.','한 점을 옮기면 어떤 선이 따라 움직일까?','이번에는 더 적은 횟수로 도전!'];const praise=['복잡한 길을 차분히 정리했어요.','움직이기 전에 결과를 예상했네요.','한 번에 안 풀려도 다른 방법을 찾아냈어요.','공간을 잘 활용해서 길을 만들었어요.'];let stage=1,nodes=[],edges=[],moves=0,drag=-1,rect;
function makeLevel(s){let n=s<=5?3:s<=10?4:s<=15?5:s<=20?6:s<=25?7:8;let e=Math.min(n*(n-1)/2,s<=5?2+(s%2):s<=10?4+(s%2):s<=15?5+(s%3):s<=20?7+(s%3):s<=25?9+(s%3):11+(s%4));nodes=Array.from({length:n},(_,i)=>({x:18+(i*29)%70,y:18+(i*47)%66}));let pairs=[];for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)pairs.push([a,b]);pairs.sort(()=>Math.random()-.5);edges=pairs.slice(0,e);moves=0}
function cross(a,b,c,d){let q=(p,r,s)=>(r.x-p.x)*(s.y-p.y)-(r.y-p.y)*(s.x-p.x);let A=nodes[a],B=nodes[b],C=nodes[c],D=nodes[d];return q(A,B,C)*q(A,B,D)<0&&q(C,D,A)*q(C,D,B)<0}function crossings(){return edges.filter((x,i)=>edges.some((y,j)=>j>i&&!x.some(v=>y.includes(v))&&cross(...x,...y))).length}
function draw(){B.innerHTML='';let bad=new Set;edges.forEach((x,i)=>edges.forEach((y,j)=>{if(j>i&&!x.some(v=>y.includes(v))&&cross(...x,...y)){bad.add(i);bad.add(j)}}));edges.forEach(([a,b],i)=>{let A=nodes[a],C=nodes[b],dx=C.x-A.x,dy=C.y-A.y,l=Math.hypot(dx,dy),z=document.createElement('i');z.className='line '+(bad.has(i)?'bad':'good');z.style.cssText=`left:${A.x}%;top:${A.y}%;width:${l}%;transform:rotate(${Math.atan2(dy,dx)}rad)`;B.append(z)});nodes.forEach((n,i)=>{let d=document.createElement('button');d.className='dot';d.textContent=i+1;d.style.left=n.x+'%';d.style.top=n.y+'%';d.onpointerdown=e=>{drag=i;rect=B.getBoundingClientRect();d.setPointerCapture(e.pointerId)};d.onpointermove=e=>{if(drag===i){n.x=Math.max(8,Math.min(92,(e.clientX-rect.left)/rect.width*100));n.y=Math.max(8,Math.min(92,(e.clientY-rect.top)/rect.height*100));draw()}};d.onpointerup=()=>{if(drag===i){drag=-1;moves++;check()}};B.append(d)});F.textContent=`교차한 길 ${crossings()}개 · 이동 ${moves}번`}
function check(){draw();if(!crossings()){M.classList.remove('hide');mt.textContent='작전 성공!';mp.innerHTML=`선이 겹치지 않게 자리를 바꿨어요.<br>${praise[Math.floor(Math.random()*praise.length)]}<br><b>${moves}번 만에 풀었어요.</b>`;go.textContent=stage===30?'30단계 완료 보기':'다음 단계'}}function start(){M.classList.add('hide');makeLevel(stage);L.textContent=stage+' / 30';P.style.width=stage/30*100+'%';mission.textContent=missions[Math.floor(Math.random()*missions.length)];draw();if(stage>=26){F.textContent='도전 단계예요. 가장 많이 꼬인 점부터 살펴보세요.'}}go.onclick=()=>{if(stage===30){mt.textContent='30단계 완주!';mp.textContent='복잡한 길을 보고 순서를 생각해 끝까지 풀어냈어요.';go.textContent='챌린지로 돌아가기';go.onclick=exit;return}stage++;start()};function exit(){try{parent.prevPage(11)}catch(e){history.back()}}const baseDraw=draw;draw=function(){for(let i=0;i<nodes.length;i++)for(let j=0;j<i;j++){let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.hypot(dx,dy);if(d<12){nodes[i].x=Math.max(8,Math.min(92,nodes[j].x+dx/d*12||nodes[j].x+12));nodes[i].y=Math.max(8,Math.min(92,nodes[j].y+dy/d*12||nodes[j].y))}}baseDraw()};start();</script><script>/* 30일 챌린지 연결: 3단계를 풀면 오늘의 놀이 완료, 단계를 풀 때마다 결과를 카드로 보냄 */(function(){var base=window.check;if(typeof base!=="function")return;window.check=function(){base.apply(this,arguments);if(M.classList.contains("hide"))return;try{if(stage>=3&&parent.completeChallengeStep)parent.completeChallengeStep(18);if(parent.reportChallengeResult)parent.reportChallengeResult(18,{summary:"꼬인 길 "+stage+"단계까지 풀었어요! (마지막 단계 "+moves+"번 만에)"})}catch(e){}}})();</script>
<script src="game-level.js"></script>
</body></html>
