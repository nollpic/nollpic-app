<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>숫자로 찾기</title>
<style>
:root{--ink:#17264a;--navy:#1f2e5a;--blue:#4e80ee;--mint:#55ce9f;--pink:#ff6e83}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Pretendard,"Malgun Gothic",sans-serif;background:#eef3ff;color:var(--ink)}button{font:inherit}.app{height:100%;display:flex;flex-direction:column;padding:12px 17px 18px;background:linear-gradient(160deg,#f8fbff,#e4edff)}header{height:54px;display:flex;align-items:center;gap:10px}.back{width:40px;height:40px;border:0;border-radius:14px;background:#e2ebff;color:#426dce;font-size:27px;font-weight:900}.heading{flex:1}.heading small{display:block;color:#5882dc;font-size:10px;font-weight:900}.heading h1{margin:1px 0;font-size:20px}.count{padding:8px 10px;border-radius:13px;background:var(--navy);color:#fff;text-align:center;font-size:10px;font-weight:900}.count b{display:block;color:#ffd860;font-size:17px}.guide{margin:5px 0 10px;text-align:center;font-size:13px;font-weight:800;color:#60708f}.game{flex:1;min-height:0;border-radius:27px;background:var(--navy);padding:18px 14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 11px 24px #253a6a30}.target-label{font-size:11px;color:#aebeed;font-weight:900;letter-spacing:.08em}.target{margin:6px 0 14px;padding:8px 24px;border-radius:12px;background:#fff;color:#2a4c98;font-size:29px;font-weight:950;letter-spacing:9px;box-shadow:0 4px 0 #bcc9e8}.target .done{color:var(--mint)}.grid{width:min(100%,330px);display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;border-radius:16px;background:#fff;box-shadow:0 6px 0 #14203d}.cell{aspect-ratio:1;border:0;border-radius:9px;background:#f0f4fc;color:#2b3e69;font-size:19px;font-weight:950}.cell:active{transform:scale(.94)}.cell.correct{background:var(--mint);color:#fff;box-shadow:inset 0 -3px #36aa7e}.cell.wrong{background:var(--pink);color:#fff;animation:shake .28s linear}.status{height:28px;margin:12px 0 0;color:#eff5ff;text-align:center;font-size:13px;font-weight:850}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#17264a70;backdrop-filter:blur(3px)}.overlay.hide{display:none}.panel{width:min(100%,340px);padding:26px 22px;border-radius:27px;background:#fff;text-align:center;box-shadow:0 20px 50px #17264a44}.hero{font-size:48px}.panel h2{margin:7px 0;font-size:22px}.panel p{margin:0 0 18px;color:#61708e;font-size:14px;font-weight:700;line-height:1.55}.panel button{width:100%;height:50px;border:0;border-radius:16px;background:#4e80ee;color:#fff;font-weight:950;box-shadow:0 4px 0 #3263c4}.panel button:active{transform:translateY(3px);box-shadow:none}.reward{display:none!important;margin-bottom:10px!important;background:#55bd8e!important;box-shadow:0 4px 0 #34936a!important}.reward.show{display:block!important}@media(max-height:620px){.app{padding-top:6px}.game{padding-top:11px}.target{margin-bottom:8px}.grid{gap:4px}.cell{font-size:17px}}
.level-bar{width:min(100%,330px);margin:8px 0 5px}.level-bar-top{display:flex;justify-content:space-between;color:#dbe6ff;font-size:10px;font-weight:900}.level-track{height:10px;margin-top:5px;padding:2px;border-radius:99px;background:#0f1938}.level-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#50d5a1,#a9ef62);transition:width .15s linear}.grid{grid-template-columns:repeat(var(--grid-size),1fr)}
</style>
    <link rel="stylesheet" href="button-motion.css?v=20261008-1">
<link rel="stylesheet" href="fonts/jua/jua.css"><script src="minigames/avatar-adapter.js" defer></script><link rel="stylesheet" href="minigames/game-intro.css"><script src="minigames/game-intro-config.js" defer></script><script src="minigames/game-intro.js" defer></script><script src="minigames/game-intro-boot.js" defer></script><link rel="stylesheet" href="minigames/play-ui.css"><script src="minigames/play-ui.js" defer></script></head>
<body>
<main class="app"><header><button class="back" onclick="exitToChallenge()" aria-label="챌린지로 돌아가기">‹</button><div class="heading"><small>16번 오늘의 미션</small><h1>숫자로 찾기</h1></div><div class="count">단계<b>Lv.<span id="round">1</span></b></div></header><p class="guide">가로 · 세로 · 대각선으로 이어진 숫자를 찾아요.</p><section class="game"><span class="target-label">FIND THIS NUMBER</span><div class="level-bar"><div class="level-bar-top"><span>제한 시간</span><span id="grid-size">4 × 4</span></div><div class="level-track"><div class="level-fill" id="level-fill"></div></div></div><div class="target" id="target"></div><div class="grid" id="grid" aria-label="숫자 격자"></div><p class="status" id="status">시간 안에 이어진 숫자를 찾아요.</p></section></main><section class="overlay" id="overlay"><div class="panel"><div class="hero" id="hero">🔎</div><h2 id="title">숫자를 이어 찾아볼까요?</h2><p id="text">시간 바가 줄어들기 전에 가로, 세로 또는<br>대각선으로 이어진 숫자를 순서대로 눌러 주세요.</p><button class="reward" id="reward">🎁 200P 받기</button><button id="start">놀이 시작</button></div></section>
<script>
const targetEl=document.getElementById('target'),grid=document.getElementById('grid'),statusEl=document.getElementById('status'),roundEl=document.getElementById('round'),fill=document.getElementById('level-fill'),sizeEl=document.getElementById('grid-size'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),reward=document.getElementById('reward');let level=1,target='',progress=0,claimed=false,pathSlots=[],timeLeft=100,lastTick=0,raf=0,playing=false;const directions=[[0,1],[1,0],[1,1],[1,-1]];
function gridSize(){return Math.min(7,level+3)}
function makeTarget(){return Array.from({length:3},()=>Math.floor(Math.random()*10)).join('')}
function createPath(size){const [rowStep,colStep]=directions[Math.floor(Math.random()*directions.length)];const rowMax=rowStep===1?size-3:size-1,colMin=colStep===-1?2:0,colMax=colStep===1?size-3:size-1;const row=Math.floor(Math.random()*(rowMax+1)),col=colMin+Math.floor(Math.random()*(colMax-colMin+1));return [0,1,2].map(step=>(row+rowStep*step)*size+col+colStep*step)}
function setupLevel(){const size=gridSize();target=makeTarget();progress=0;pathSlots=createPath(size);timeLeft=100;grid.style.setProperty('--grid-size',size);sizeEl.textContent=`${size} × ${size}`;roundEl.textContent=level;targetEl.innerHTML=target.split('').map((digit,index)=>`<span data-digit="${index}">${digit}</span>`).join('');const cells=Array.from({length:size*size},()=>String(Math.floor(Math.random()*10)));target.split('').forEach((digit,index)=>cells[pathSlots[index]]=digit);grid.innerHTML='';cells.forEach((digit,index)=>{const button=document.createElement('button');button.type='button';button.className='cell';button.textContent=digit;button.addEventListener('click',()=>selectDigit(button,digit,index));grid.append(button)});statusEl.textContent=`Lv.${level}: ${target}이(가) 한 줄로 이어져 있어요.`}
function selectDigit(button,digit,index){if(!playing||button.disabled)return;const expected=target[progress];if(digit===expected&&index===pathSlots[progress]){button.classList.add('correct');button.disabled=true;targetEl.querySelector(`[data-digit="${progress}"]`).classList.add('done');progress++;if(progress===target.length){playing=false;level++;statusEl.textContent='성공! 시간 바가 다시 채워졌어요.';if(level>4)finish();else setTimeout(()=>{playing=true;setupLevel()},550)}else statusEl.textContent=`좋아요! 다음 숫자 ${target[progress]}을 이어서 찾아요.`}else{button.classList.add('wrong');statusEl.textContent=`연결된 숫자 줄을 다시 살펴봐요. 다음은 ${expected}이에요.`;setTimeout(()=>button.classList.remove('wrong'),300)}}
function timer(t){if(!playing)return;const delta=(t-lastTick)/1000;lastTick=t;timeLeft=Math.max(0,timeLeft-delta*3.1);fill.style.width=`${timeLeft}%`;if(timeLeft<=0){gameOver();return}raf=requestAnimationFrame(timer)}
function begin(){cancelAnimationFrame(raf);level=1;playing=true;overlay.classList.add('hide');setupLevel();lastTick=performance.now();raf=requestAnimationFrame(timer)}
function gameOver(){playing=false;cancelAnimationFrame(raf);document.getElementById('hero').textContent='⏳';document.getElementById('title').textContent=`Lv.${level}까지 성공!`;document.getElementById('text').innerHTML=`${gridSize()} × ${gridSize()} 격자까지 도전했어요.<br>다시 도전해 더 높은 단계를 기록해 봐요!`;start.textContent='다시 하기';start.onclick=begin;overlay.classList.remove('hide')}
function finish(){playing=false;cancelAnimationFrame(raf);try{parent.completeChallengeStep&&parent.completeChallengeStep(16)}catch(e){}document.getElementById('hero').textContent='🎉';document.getElementById('title').textContent='Lv.4 완료!';document.getElementById('text').innerHTML='4×4부터 7×7까지 모두 통과했어요!<br>집중해서 끝까지 잘 해냈어요.';reward.classList.add('show');start.textContent='챌린지로 돌아가기';start.onclick=exitToChallenge;overlay.classList.remove('hide')}
function exitToChallenge(){playing=false;cancelAnimationFrame(raf);try{parent.prevPage&&parent.prevPage(11);return}catch(e){}history.back()}reward.onclick=()=>{if(claimed)return;claimed=true;try{parent.claimChallengeStepReward&&parent.claimChallengeStepReward(16)}catch(e){}reward.textContent='200P 받았어요';reward.disabled=true};start.onclick=begin;
</script>
<script>/* 마지막 화면의 결과를 30일 챌린지 홈 "오늘의 평가" 카드로 보냄 */(function(){var step=16,o=document.getElementById("overlay"),r=document.getElementById("reward"),sent="";if(!o||!r)return;new MutationObserver(function(){if(o.classList.contains("hide")||r.offsetParent===null)return;var g=function(id){var e=document.getElementById(id);return e?(e.innerText||e.textContent).replace(/\s+/g," ").trim():""};var summary=(g("title")+" "+g("text")).trim();if(!summary||summary===sent)return;sent=summary;try{parent.reportChallengeResult&&parent.reportChallengeResult(step,{summary:summary.slice(0,80),source:"auto"})}catch(e){}}).observe(o,{attributes:true,attributeFilter:["class"],subtree:true,childList:true})})();</script>
<script src="game-level.js"></script>
</body>
</html>
