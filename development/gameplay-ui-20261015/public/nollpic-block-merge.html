<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>블록 합치기</title><style>
:root{--navy:#18264c;--blue:#497af0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Pretendard,"Malgun Gothic",sans-serif;background:#f2f5ff;color:var(--navy)}button{font:inherit}.app{height:100%;display:flex;flex-direction:column;padding:12px 17px 18px;background:linear-gradient(155deg,#f8fbff,#e7edff)}header{height:54px;display:flex;align-items:center;gap:10px}.back{width:40px;height:40px;border:0;border-radius:14px;background:#e2ebff;color:#426dce;font-size:27px;font-weight:900}.heading{flex:1}.heading small{display:block;color:#6385d7;font-size:10px;font-weight:900}.heading h1{margin:1px 0;font-size:20px}.score{padding:7px 10px;border-radius:13px;background:var(--navy);color:#dbe6ff;text-align:center;font-size:10px;font-weight:900}.score b{display:block;color:#ffd65c;font-size:18px}.info{margin:3px 0 9px;text-align:center;color:#61708e;font-size:13px;font-weight:800}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:7px;padding:11px;border-radius:25px;background:#263969;box-shadow:inset 0 0 0 3px #16264b,0 10px 20px #26396933}.block{border:0;border-radius:12px;color:#fff;font-size:18px;font-weight:950;box-shadow:inset 0 -4px #0002,0 2px 0 #0002;transition:transform .15s}.block:active{transform:scale(.91)}.b2{background:#55c99b}.b4{background:#4a9dec}.b8{background:#a46bf3}.b16{background:#f26f9c}.b32{background:#ffad4b}.block.empty{background:#384d7b;box-shadow:none}.block.selected{outline:4px solid #ffde5c;transform:scale(.94)}.hint{height:27px;margin:10px 0 0;text-align:center;color:#556887;font-size:13px;font-weight:850}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#17264a70;backdrop-filter:blur(3px)}.overlay.hide{display:none}.panel{width:min(100%,340px);padding:26px 22px;border-radius:27px;background:#fff;text-align:center;box-shadow:0 20px 50px #17264a44}.hero{font-size:48px}.panel h2{margin:7px 0;font-size:22px}.panel p{margin:0 0 18px;color:#61708e;font-size:14px;font-weight:700;line-height:1.55}.panel button{width:100%;height:50px;border:0;border-radius:16px;background:#497af0;color:#fff;font-weight:950;box-shadow:0 4px 0 #315cc0}.reward{display:none!important;margin-bottom:10px!important;background:#55bd8e!important;box-shadow:0 4px 0 #34936a!important}.reward.show{display:block!important}
</style>    <link rel="stylesheet" href="button-motion.css?v=20261008-1">
<link rel="stylesheet" href="fonts/jua/jua.css"><script src="minigames/avatar-adapter.js" defer></script><link rel="stylesheet" href="minigames/game-intro.css"><script src="minigames/game-intro-config.js" defer></script><script src="minigames/game-intro.js" defer></script><script src="minigames/game-intro-boot.js" defer></script><link rel="stylesheet" href="minigames/play-ui.css"><script src="minigames/play-ui.js" defer></script></head><body><main class="app"><header><button class="back" onclick="exitToChallenge()">‹</button><div class="heading"><small>17번 오늘의 미션</small><h1>블록 합치기</h1></div><div class="score">점수<b id="score">0 / 64</b></div></header><p class="info">같은 숫자의 이웃 블록 두 개를 눌러 합쳐요.</p><section class="board" id="board"></section><p class="hint" id="hint">이웃한 같은 숫자를 눌러요.</p></main><section class="overlay" id="overlay"><div class="panel"><div class="hero" id="hero">🧩</div><h2 id="title">블록을 합쳐 볼까요?</h2><p id="text">가로 또는 세로로 붙어 있는<br>같은 숫자 블록 두 개를 눌러 합쳐요.</p><button class="reward" id="reward">🎁 200P 받기</button><button id="start">놀이 시작</button></div></section><script>
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),reward=document.getElementById('reward');let cells=[],selected=-1,score=0,claimed=false;const size=30;
function seed(){cells=Array.from({length:size},(_,i)=>i<24?(Math.random()<.56?2:4):0);cells[0]=2;cells[1]=2;cells[6]=4;cells[7]=4;score=0;selected=-1;render()}
function render(){board.innerHTML='';cells.forEach((value,index)=>{const b=document.createElement('button');b.className=value?`block b${Math.min(value,32)}`:'block empty';b.textContent=value||'';b.disabled=!value;b.classList.toggle('selected',selected===index);b.onclick=()=>choose(index);board.append(b)});scoreEl.textContent=`${score} / 64`}
function adjacent(a,b){return Math.abs(a-b)===1&&Math.floor(a/5)===Math.floor(b/5)||Math.abs(a-b)===5}
function addBlocks(){const empties=cells.map((v,i)=>v?null:i).filter(v=>v!==null).sort(()=>Math.random()-.5);empties.slice(0,3).forEach(i=>cells[i]=Math.random()<.7?2:4)}
function choose(index){if(selected<0){selected=index;hint.textContent='같은 숫자의 이웃 블록을 하나 더 눌러요.';render();return}if(index===selected){selected=-1;render();return}if(cells[index]===cells[selected]&&adjacent(index,selected)){cells[index]*=2;cells[selected]=0;score+=cells[index];selected=-1;addBlocks();hint.textContent='합치기 성공! 더 큰 숫자를 만들어 봐요.';render();if(score>=64)setTimeout(finish,350)}else{selected=index;hint.textContent='같은 숫자가 바로 옆에 있어야 해요.';render()}}
function begin(){overlay.classList.add('hide');seed()}function finish(){try{parent.completeChallengeStep&&parent.completeChallengeStep(17)}catch(e){}document.getElementById('hero').textContent='🎉';document.getElementById('title').textContent='블록 합치기 완료!';document.getElementById('text').innerHTML='64점을 모았어요!<br>같은 숫자를 잘 찾아 합쳤어요.';reward.classList.add('show');start.textContent='챌린지로 돌아가기';start.onclick=exitToChallenge;overlay.classList.remove('hide')}function exitToChallenge(){try{parent.prevPage&&parent.prevPage(11);return}catch(e){}history.back()}reward.onclick=()=>{if(claimed)return;claimed=true;try{parent.claimChallengeStepReward&&parent.claimChallengeStepReward(17)}catch(e){}reward.textContent='200P 받았어요';reward.disabled=true};start.onclick=begin;
</script><script>/* 마지막 화면의 결과를 30일 챌린지 홈 "오늘의 평가" 카드로 보냄 */(function(){var step=17,o=document.getElementById("overlay"),r=document.getElementById("reward"),sent="";if(!o||!r)return;new MutationObserver(function(){if(o.classList.contains("hide")||r.offsetParent===null)return;var g=function(id){var e=document.getElementById(id);return e?(e.innerText||e.textContent).replace(/\s+/g," ").trim():""};var summary=(g("title")+" "+g("text")).trim();if(!summary||summary===sent)return;sent=summary;try{parent.reportChallengeResult&&parent.reportChallengeResult(step,{summary:summary.slice(0,80),source:"auto"})}catch(e){}}).observe(o,{attributes:true,attributeFilter:["class"],subtree:true,childList:true})})();</script>

</body></html>
