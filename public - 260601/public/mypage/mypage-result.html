<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>놀픽 검사 기록 마이페이지</title>
  <link rel="stylesheet" href="mypage-result.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <button class="back-btn">‹</button>
      <div class="page-label">NOLLPIC REPORT</div>
    </header>

<section class="complete-hero">

  <div class="complete-text">
    <h1>검사 완료! 🎉</h1>
    <p>
      오늘도 뇌 탐험 성공!<br>
      5가지 활동 결과가 저장되었어요.
    </p>
  </div>
</section>

    <section class="child-card">
      <div>
        <span>아이 정보</span>
        <strong id="child-name">김놀픽 · 초2</strong>
      </div>
    </section>

    <section class="latest-card">
      <div class="section-head">
        <h2>최근 검사 결과</h2>
        <span id="latest-date">2026.06.01</span>
      </div>

      <div class="score-summary">
        <div>
          <span>종합 결과</span>
          <strong id="overall-score">82</strong>
        </div>
        <p id="overall-comment">지난 기록보다 7점 좋아졌어요.</p>
      </div>

      <div id="ability-list" class="ability-list"></div>

    <div class="share-buttons">
      <button class="share-main-btn" onclick="shareResult()">
       결과 공유하기
      </button>
    </div>
    </section>

    <section class="history-card">
      <button class="accordion-btn" onclick="toggleHistory()">
        <div>
          <h2>과거 데이터 보기</h2>
          <span>이전 검사 기록을 영역별로 확인해요</span>
        </div>
        <strong id="accordion-icon">⌄</strong>
      </button>

      <div id="history-panel" class="history-panel">
        <div class="growth-card">
          <div class="growth-head">
            <div>
              <h3>📈 성장 그래프</h3>
              <p id="growth-summary">최근 기록의 변화 흐름을 확인해요</p>
            </div>
            <span id="growth-badge">성장중</span>
          </div>
          <canvas id="growthChart"></canvas>
        </div>

        <div id="history-list" class="history-list"></div>
      </div>
    </section>

    <section class="analysis-card">
      <h2>놀픽 분석</h2>
      <p id="analysis-text"></p>
    </section>

    <p class="disclaimer">
      본 결과는 놀이형 인지 활동의 수행 기록이며, 의료적 진단 또는 치료 목적의 검사가 아닙니다.
    </p>
  </main>

  <script src="mypage-result.js"></script>
</body>
</html>
