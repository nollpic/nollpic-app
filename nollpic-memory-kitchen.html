<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>놀픽 기억공방</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-display: swap;
    }

    :root {
      --app-bg: #fff8f8;
      --paper: #ffffff;
      --ink: #071936;
      --navy: #0e1d3e;
      --muted: #536079;
      --soft: #f2f5f8;
      --line: #edf0f4;
      --orange: #ff6b00;
      --orange-dark: #e85314;
      --peach: #fff0e8;
      --blue: #1297dc;
      --green: #2fb356;
      --shadow: 0 16px 36px rgba(14, 29, 62, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #e2e8f0;
      color: var(--ink);
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 8px 0;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .app-device {
      width: min(100%, 410px);
      height: min(840px, calc(100dvh - 16px));
      min-height: 680px;
      position: relative;
      overflow: hidden;
      border: 8px solid #ffffff;
      border-radius: 40px;
      background: var(--app-bg);
      box-shadow: 0 25px 60px rgba(14, 29, 62, .12);
    }

    .game {
      height: 100%;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(180deg, rgba(255, 248, 248, .98), rgba(255, 255, 255, .94) 62%, #f5fbff),
        radial-gradient(circle at 10% 10%, rgba(255, 107, 0, .08), transparent 28%);
    }

    .topbar {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      padding: 14px 18px 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--peach);
      color: var(--orange-dark);
      font-size: 26px;
      line-height: 1;
      font-weight: 800;
    }

    .title-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      min-width: 0;
    }

    .today-label {
      display: block;
      color: var(--orange-dark);
      font-size: 12px;
      line-height: 1;
      font-weight: 800;
    }

    .title-line {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      flex: 1 1 auto;
      display: inline-flex;
      align-items: center;
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.1;
      font-weight: 900;
      white-space: nowrap;
    }

    .workshop-prefix {
      flex: 0 0 auto;
    }

    #workshopTitle {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skill-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #fff4ee;
      color: var(--orange-dark);
      border: 1px solid rgba(255, 107, 0, .18);
      font-size: 10.5px;
      font-weight: 900;
      box-shadow: 0 6px 12px rgba(255, 107, 0, .08);
    }

    .progress-wrap {
      flex-shrink: 0;
      padding: 0 20px 12px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .progress {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf3;
    }

    .progress span {
      display: block;
      width: 20%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff8a1f, #ff5e1a);
      transition: width .36s ease;
    }

    .screen {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
      padding: 0 20px 20px;
      overflow: hidden;
    }

    .mission-card,
    .stage-card,
    .result-card {
      border-radius: 20px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
    }

    .mission-card {
      padding: 16px;
      border: 1px solid rgba(14, 29, 62, .04);
    }

    .mission-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .stage-label {
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .timer-chip {
      min-width: 54px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #fff4ee;
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .timer-chip.stage-timer {
      min-width: 78px;
      height: 58px;
      align-self: center;
      margin: -2px 0 2px;
      border-radius: 18px;
      font-size: 22px;
      font-weight: 950;
      box-shadow: 0 10px 22px rgba(255, 107, 0, .14);
    }

    .mission-text {
      color: var(--ink);
      font-size: 19px;
      line-height: 1.32;
      font-weight: 900;
    }

    .mission-sub {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.42;
      font-weight: 700;
    }

    .mission-sub.tutorial-copy {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.48;
      font-weight: 800;
      word-break: keep-all;
    }

    .tutorial-copy strong {
      color: var(--orange-dark);
      font-weight: 900;
    }

    .tutorial-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-weight: 750;
    }

    .mission-sub.rule-highlight {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      color: var(--ink);
      font-weight: 900;
    }

    .rule-chip {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff4ee;
      color: var(--orange-dark);
      box-shadow: 0 5px 12px rgba(255, 107, 0, .12);
    }

    .rule-chip.strong {
      background: var(--navy);
      color: #ffffff;
    }

    .rule-arrow {
      color: var(--orange);
      font-size: 20px;
      line-height: 1;
      font-weight: 900;
    }

    .rule-note {
      flex: 1 0 100%;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
    }

    .stage-card {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 18px 16px;
      overflow: hidden;
    }

    .sequence-strip {
      width: 100%;
      min-height: 34px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border-radius: 14px;
      background: #fff4ee;
      color: var(--ink);
      border: 1px solid rgba(255, 107, 0, .14);
      box-shadow: 0 8px 16px rgba(255, 107, 0, .09);
      font-size: 13px;
      line-height: 1.24;
      font-weight: 900;
      text-align: center;
      word-break: keep-all;
    }

    .sequence-strip.is-visible {
      display: flex;
    }

    .stage-card.is-making {
      justify-content: flex-start;
      overflow: hidden;
    }

    .board {
      position: relative;
      min-height: 208px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(255, 240, 210, .75), transparent 55%),
        linear-gradient(180deg, #fff9f7, #ffffff);
      border: 1px solid rgba(14, 29, 62, .04);
      overflow: hidden;
    }

    .board::before,
    .board::after {
      content: "";
      display: none;
    }

    .board.hidden-mode {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 107, 0, .13), transparent 34%),
        linear-gradient(180deg, #fff4ee, #f7fbff);
    }

    .board.hidden-mode::before,
    .board.hidden-mode::after {
      display: none;
    }

    .example-label {
      position: absolute;
      left: 50%;
      top: 18px;
      z-index: 3;
      transform: translateX(-50%);
      min-height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      border-radius: 999px;
      background: #fff4ee;
      color: var(--orange-dark);
      font-size: 13px;
      line-height: 1;
      font-weight: 900;
      box-shadow: 0 7px 14px rgba(255, 107, 0, .12);
    }

    .board.hidden-mode .example-label {
      display: none;
    }

    .board:not(.show-example) .example-label {
      display: none;
    }

    .board,
    .board * {
      cursor: none;
    }

    .plate {
      position: relative;
      width: min(334px, 100%);
      height: 142px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: transparent;
      z-index: 1;
    }

    .gimbap-stack {
      position: relative;
      z-index: 1;
      width: min(326px, 96%);
      height: 132px;
      border-radius: 999px;
      background: linear-gradient(145deg, #152131, #0d1624);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.12),
        0 6px 0 rgba(13, 20, 32, .12),
        0 14px 24px rgba(14, 29, 62, .16);
    }

    .gimbap-stack::before {
      content: "";
      position: absolute;
      inset: 7px;
      z-index: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff9eb 0%, #f5eddb 100%);
      box-shadow:
        inset 0 4px 10px rgba(255,255,255,.68),
        inset 0 -5px 12px rgba(116, 91, 54, .08);
    }

    .gimbap-stack::after {
      content: "";
      position: absolute;
      inset: 15px;
      z-index: 1;
      border-radius: 999px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.12), transparent 42%);
      opacity: .95;
    }

    .ingredient {
      position: relative;
      z-index: 2;
      width: 56px;
      height: 82px;
      flex: 0 0 56px;
      border-radius: 21px;
      box-shadow:
        inset 0 8px 12px rgba(255,255,255,.36),
        inset 0 -7px 12px rgba(14,29,62,.1),
        0 6px 0 rgba(14,29,62,.08);
    }

    .gimbap-stack > .ingredient {
      position: absolute;
      left: var(--x, 50%);
      top: var(--y, 50%);
      transform: translate(-50%, -50%);
    }

    .gimbap-stack > .ingredient.demo-pop {
      animation: ingredientDemoPop .74s cubic-bezier(.2, .9, .25, 1.1) both;
    }

    .ingredient.carrot {
      background:
        repeating-linear-gradient(128deg, rgba(155,58,0,.24) 0 5px, transparent 5px 13px),
        repeating-linear-gradient(70deg, transparent 0 18px, rgba(255,190,80,.16) 18px 24px),
        linear-gradient(180deg, #ff8e22, #ff6b00);
    }

    .ingredient.egg {
      background:
        radial-gradient(ellipse at 50% 52%, transparent 0 25px, rgba(255,180,0,.18) 26px 30px, transparent 31px),
        radial-gradient(ellipse at 44% 76%, rgba(236,164,0,.12) 0 3px, transparent 4px),
        linear-gradient(180deg, #ffe477, #ffc928);
    }

    .ingredient.radish {
      background:
        radial-gradient(circle at 34% 28%, rgba(255,220,150,.2) 0 3px, transparent 4px),
        radial-gradient(circle at 68% 68%, rgba(92,45,21,.18) 0 4px, transparent 5px),
        repeating-linear-gradient(125deg, rgba(77,37,18,.18) 0 5px, transparent 5px 12px),
        linear-gradient(180deg, #b97937, #7a421d);
    }

    .ingredient.cucumber {
      background:
        radial-gradient(circle at 28% 34%, rgba(35,129,52,.28) 0 4px, transparent 5px),
        radial-gradient(circle at 72% 62%, rgba(35,129,52,.26) 0 4px, transparent 5px),
        radial-gradient(circle at 55% 82%, rgba(35,129,52,.2) 0 3px, transparent 4px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.24) 0 7px, transparent 7px 16px),
        linear-gradient(180deg, #8fe36d, #25aa54);
    }

    .ingredient.ham {
      background:
        repeating-linear-gradient(90deg, rgba(194,55,83,.18) 0 7px, transparent 7px 16px),
        linear-gradient(90deg, rgba(255,255,255,.2), transparent 18%, transparent 82%, rgba(150,30,60,.12)),
        linear-gradient(180deg, #ff9eb0, #ef5c7e);
    }

    body[data-theme="gimbap"] .ingredient.egg,
    body[data-theme="gimbap"] .ingredient.ham,
    body[data-theme="gimbap"] .ingredient.carrot,
    body[data-theme="gimbap"] .ingredient.cucumber {
      background-image: url("images/gimbap-level2-reference.png");
      background-repeat: no-repeat;
      background-size: 400% 100%;
      background-color: transparent;
      box-shadow:
        inset 0 7px 9px rgba(255,255,255,.2),
        inset 0 -7px 10px rgba(14,29,62,.08),
        0 6px 0 rgba(14,29,62,.07);
    }

    body[data-theme="gimbap"] .ingredient.egg {
      background-position: 0% 50%;
    }

    body[data-theme="gimbap"] .ingredient.ham {
      background-position: 33.333% 50%;
    }

    body[data-theme="gimbap"] .ingredient.carrot {
      background-position: 66.667% 50%;
    }

    body[data-theme="gimbap"] .ingredient.cucumber {
      background-position: 100% 50%;
    }

    body[data-theme="gimbap"] .ingredient.radish {
      background-image: url("images/gimbap-burdock.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 106% 110%;
      background-color: transparent;
      box-shadow:
        inset 0 8px 12px rgba(255,255,255,.12),
        inset 0 -7px 12px rgba(14,29,62,.14),
        0 6px 0 rgba(14,29,62,.08);
    }

    body[data-theme="gimbap"] .gimbap-stack,
    body[data-theme="gimbap"] .slots {
      height: 146px;
      background: linear-gradient(180deg, #fff9eb 0%, #f5eddb 100%);
      box-shadow:
        0 6px 0 rgba(13, 20, 32, .1),
        0 14px 24px rgba(14, 29, 62, .14);
    }

    body[data-theme="gimbap"] .plate {
      height: 156px;
    }

    body[data-theme="gimbap"] .slots {
      flex-basis: 146px;
    }

    body[data-theme="gimbap"] .gimbap-stack::before,
    body[data-theme="gimbap"] .gimbap-stack::after,
    body[data-theme="gimbap"] .slots::before,
    body[data-theme="gimbap"] .slots::after {
      display: none;
    }

    .ingredient.salmon {
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,.34) 0 5px, transparent 5px 17px),
        linear-gradient(180deg, #ff986e, #f36542);
    }

    .ingredient.tuna {
      background:
        repeating-linear-gradient(90deg, rgba(120, 13, 32, .16) 0 8px, transparent 8px 18px),
        linear-gradient(180deg, #ef4f64, #c9263f);
    }

    .ingredient.shrimp {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 6px, transparent 6px 17px),
        linear-gradient(180deg, #ffb093, #f36e59);
    }

    .ingredient.bun {
      background:
        radial-gradient(ellipse at 24% 28%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(ellipse at 47% 20%, rgba(255,255,255,.86) 0 2px, transparent 3px),
        radial-gradient(ellipse at 72% 34%, rgba(255,255,255,.86) 0 2px, transparent 3px),
        linear-gradient(180deg, #f6a13f, #e87521);
    }

    .ingredient.patty {
      background:
        repeating-linear-gradient(14deg, rgba(67, 28, 16, .18) 0 4px, transparent 4px 11px),
        linear-gradient(180deg, #9c4e32, #69301e);
    }

    .ingredient.cheese {
      background:
        radial-gradient(circle at 26% 42%, rgba(189,121,0,.18) 0 4px, transparent 5px),
        radial-gradient(circle at 67% 58%, rgba(189,121,0,.16) 0 3px, transparent 4px),
        linear-gradient(180deg, #ffd858, #f5ac23);
    }

    .ingredient.lettuce {
      background:
        radial-gradient(ellipse at 25% 50%, rgba(255,255,255,.2) 0 14px, transparent 15px),
        radial-gradient(ellipse at 55% 40%, rgba(255,255,255,.18) 0 16px, transparent 17px),
        linear-gradient(180deg, #88df34, #4bbd22);
    }

    .ingredient.tomato {
      background:
        radial-gradient(circle at 34% 48%, rgba(255,188,122,.42) 0 4px, transparent 5px),
        radial-gradient(circle at 66% 47%, rgba(255,188,122,.34) 0 4px, transparent 5px),
        linear-gradient(180deg, #ef3f2f, #c5221d);
    }

    body[data-theme="sushi"] .board {
      background:
        radial-gradient(ellipse at 50% 52%, rgba(118, 205, 255, .18), transparent 52%),
        linear-gradient(180deg, #f7fbff, #ffffff);
    }

    body[data-theme="sushi"] .gimbap-stack,
    body[data-theme="sushi"] .slots {
      width: min(326px, 98%);
      height: 132px;
      border-radius: 28px;
      background: #ffffff;
      box-shadow:
        inset 0 0 0 2px rgba(18, 151, 220, .08),
        0 13px 24px rgba(14, 29, 62, .12);
    }

    body[data-theme="sushi"] .gimbap-stack::before,
    body[data-theme="sushi"] .slots::before {
      inset: 8px;
      border-radius: 24px;
      background: linear-gradient(180deg, #fff9eb, #f3ead9);
    }

    body[data-theme="sushi"] .gimbap-stack::after,
    body[data-theme="sushi"] .slots::after {
      inset: 18px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), transparent 50%),
        radial-gradient(ellipse at 25% 42%, rgba(232,217,188,.35) 0 2px, transparent 3px),
        radial-gradient(ellipse at 65% 52%, rgba(232,217,188,.35) 0 2px, transparent 3px);
    }

    body[data-theme="sushi"] .ingredient {
      width: 72px;
      height: 58px;
      border-radius: 0;
      box-shadow: none;
      filter: drop-shadow(0 8px 7px rgba(14, 29, 62, .12));
    }

    body[data-theme="sushi"] .ingredient.salmon {
      background: url("images/sushi-salmon.png") center / contain no-repeat;
    }

    body[data-theme="sushi"] .ingredient.tuna {
      background: url("images/sushi-salmon.png") center / contain no-repeat;
    }

    body[data-theme="sushi"] .ingredient.shrimp {
      background: url("images/sushi-shrimp.png") center / contain no-repeat;
      width: 66px;
      height: 66px;
    }

    body[data-theme="sushi"] .ingredient.sushi-roe {
      background: url("images/sushi-roe.png") center / contain no-repeat;
      width: 66px;
      height: 66px;
    }

    body[data-theme="sushi"] .ingredient.sushi-seaweed {
      background: url("images/sushi-roe.png") center / contain no-repeat;
      width: 66px;
      height: 66px;
    }

    body[data-theme="sushi"] .ingredient.sushi-white {
      background: url("images/sushi-shrimp.png") center / contain no-repeat;
    }

    body[data-theme="sushi"] .ingredient.sushi-eel {
      background: url("images/sushi-eel.png") center / contain no-repeat;
    }

    body[data-theme="sushi"] .ingredient.sushi-egg {
      background: url("images/sushi-egg.png") center / contain no-repeat;
      width: 86px;
      height: 70px;
    }

    body[data-theme="sushi"] .ingredient.sushi-pink {
      background: url("images/sushi-salmon.png") center / contain no-repeat;
    }

    body[data-theme="sushi"] .slot {
      width: 70px;
      height: 68px;
      border-radius: 20px;
    }

    body[data-theme="sushi"] .ingredient-btn .ingredient {
      width: 45px;
      height: 34px;
      border-radius: 0;
      filter: drop-shadow(0 4px 4px rgba(14, 29, 62, .1));
    }

    body[data-theme="sushi"] .ingredient-btn .ingredient.shrimp {
      width: 40px;
      height: 38px;
    }

    body[data-theme="sushi"] .ingredient-btn .ingredient.sushi-roe,
    body[data-theme="sushi"] .ingredient-btn .ingredient.sushi-seaweed {
      width: 40px;
      height: 38px;
    }

    body[data-theme="sushi"] .ingredient-btn .ingredient.sushi-egg {
      width: 57px;
      height: 46px;
    }

    body[data-theme="burger"] .board {
      align-items: start;
      justify-items: center;
      overflow: visible;
      background:
        radial-gradient(ellipse at 50% 58%, rgba(255, 175, 83, .16), transparent 54%),
        linear-gradient(180deg, #fffaf3, #ffffff);
      min-height: 238px;
      padding-top: 0;
      padding-bottom: 0;

  <script>

        return "need";

    function playTone(frequency, startAt, duration, gainValue = 0.08, type = "sine") {
      const ctx = audioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, startAt);
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(gainValue, startAt + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + duration + 0.02);
    }

    function selectSwapRule(cfg) {
      const rules = cfg.appliedRules || cfg.swapRules;
      activeSwapRule = rules ? shuffle(rules)[0] : null;
    }

    function transformSequence(seq, cfg) {
      if (activeSwapRule?.type === "swap" || (activeSwapRule && Number.isInteger(activeSwapRule.a))) {
        const next = [...seq];
        const left = next[activeSwapRule.a];
        next[activeSwapRule.a] = next[activeSwapRule.b];
        next[activeSwapRule.b] = left;
        return next;
      }
      if (activeSwapRule?.type === "move-front") {
        const rest = seq.filter(key => key !== activeSwapRule.key);
        return [activeSwapRule.key, ...rest].slice(0, seq.length);
      }
      if (activeSwapRule?.type === "duplicate") {
        const next = [...seq];
        const firstIndex = next.indexOf(activeSwapRule.key);
        if (firstIndex < 0) return next;
        const replaceIndex = next.findIndex((key, index) => key !== activeSwapRule.key && index !== firstIndex);
        if (replaceIndex >= 0) next[replaceIndex] = activeSwapRule.key;
        return next;
      }
      if (activeSwapRule?.type === "remove") {
        return seq.filter(key => key !== activeSwapRule.key);
      }
      return cfg.transform(seq);
    }

    function requiredIngredientsForRule(rule) {
      if (!rule?.key) return [];
      if (["move-front", "duplicate", "remove"].includes(rule.type)) return [rule.key];
      return [];
    }

    function makeBaseSequence(cfg) {
      const required = [...new Set(requiredIngredientsForRule(activeSwapRule))]
        .filter(key => ingredientKeys.includes(key));

      if (cfg.allowRepeats) {
        if (cfg.length <= 4) {
          return shuffle(ingredientKeys).slice(0, cfg.length);
        }

        const sequence = [...required];
        while (sequence.length < cfg.length) {
          sequence.push(ingredientKeys[Math.floor(Math.random() * ingredientKeys.length)]);
        }
        if (cfg.length >= 5 && !sequence.some((key, index) => sequence.indexOf(key) !== index)) {
          sequence[cfg.length - 2] = sequence[cfg.length - 3];
        }
        return shuffle(sequence).slice(0, cfg.length);
      }

      const rest = ingredientKeys.filter(key => !required.includes(key));
      const fill = shuffle(rest).slice(0, Math.max(0, cfg.length - required.length));
      const sequence = shuffle([...required, ...fill]).slice(0, cfg.length);
      if (activeSwapRule?.type === "move-front" && sequence[0] === activeSwapRule.key && sequence.length > 1) {
        const swapIndex = 1 + Math.floor(Math.random() * (sequence.length - 1));
        [sequence[0], sequence[swapIndex]] = [sequence[swapIndex], sequence[0]];
      }
      return sequence;
    }

    function makeTraySequence(cfg) {
      if (cfg.tray === "all") return shuffle([...new Set(ingredientKeys)]);
      const required = [...new Set(answerSequence)];
      const count = cfg.trayCount || required.length;
      const extras = shuffle(ingredientKeys.filter(key => !required.includes(key))).slice(0, Math.max(0, count - required.length));
      return shuffle([...required, ...extras]);
    }

    function makeSequence() {
      const cfg = currentMode();
      selectSwapRule(cfg);
      const base = makeBaseSequence(cfg);
      memorySequence = base;
      answerSequence = transformSequence(base.slice(0, cfg.length), cfg);
      if (answerSequence.length < 3) {
        answerSequence = base.slice(0, 3);
      }
      playerSequence = Array(answerSequence.length).fill(null);
      traySequence = makeTraySequence(cfg);
      mistakeIndexes = new Set();
      selectedIngredient = null;
    }

    function ingredientEl(key, position) {
      const item = ingredients[key];
      const node = document.createElement("span");
      node.className = `ingredient ${key}`;
      node.setAttribute("aria-label", item.label);
      if (position) {
        node.style.setProperty("--x", `${position.x}%`);
        node.style.setProperty("--y", `${position.y}%`);
      }
      return node;
    }

    function renderMemory() {
      els.memoryStack.innerHTML = "";
      const positions = layoutFor(memorySequence.length);
      memorySequence.forEach((key, index) => {
        const node = ingredientEl(key, positions[index]);
        node.dataset.order = String(index);
        els.memoryStack.appendChild(node);
      });
    }

    function clearTutorialDemo() {
      tutorialTimers.forEach(id => clearTimeout(id));
      tutorialTimers = [];
      document.querySelectorAll(".drag-ghost").forEach(node => node.remove());
      els.memoryStack.querySelectorAll(".demo-pop").forEach(node => {
        node.classList.remove("demo-pop");
      });
    }

    function setReadyTutorialCopy() {
      els.missionSub.className = "mission-sub tutorial-copy";
      els.missionSub.dataset.narration = "스시 재료 순서를 잘 보세요. 그럼 마우스를 드래그해서 빈칸에 방금 기억한 스시를 차례대로 갖다 놓는 거예요. 이해 되셨죠? 그럼 아래 시작 버튼을 눌러주세요!";
      els.missionSub.innerHTML = `
        <strong>스시 재료 순서를 잘 보세요!</strong>
        <span>재료가 하나씩 커지면 순서를 기억하고, 시작 후 마우스로 드래그해서 빈칸에 차례대로 놓아요.</span>
      `;
    }

    function setReadyTutorialCopy() {
      els.missionSub.className = "mission-sub tutorial-copy";
      const foodName = {
        sushi: "\uC2A4\uC2DC",
        gimbap: "\uAE40\uBC25",
        burger: "\uD584\uBC84\uAC70"
      }[currentMode().theme] || "\uC2A4\uC2DC";
      els.missionSub.dataset.narration = `${foodName} \uC7AC\uB8CC \uC21C\uC11C\uB97C \uC798 \uBCF4\uC138\uC694. \uADF8\uB7FC \uB9C8\uC6B0\uC2A4\uB97C \uB4DC\uB798\uADF8\uD574\uC11C \uBE48\uCE78\uC5D0 \uBC29\uAE08 \uAE30\uC5B5\uD55C ${foodName}\uB97C \uCC28\uB840\uB300\uB85C \uAC16\uB2E4 \uB193\uB294 \uAC70\uC608\uC694. \uC774\uD574 \uB418\uC168\uC8E0? \uADF8\uB7FC \uC544\uB798 \uC2DC\uC791 \uBC84\uD2BC\uC744 \uB20C\uB7EC\uC8FC\uC138\uC694!`;
      els.missionSub.innerHTML = `<strong>${foodName} \uC7AC\uB8CC \uC21C\uC11C\uB97C \uC798 \uBCF4\uC138\uC694!</strong>`;
    }

    function placeTimerAboveBoard() {
      if (!els.timerChip || !els.stageCard || !els.board) return;
      els.timerChip.classList.add("stage-timer");
      els.stageCard.insertBefore(els.timerChip, els.board);
    }

    function startTutorialDemo() {
      clearTutorialDemo();
      if (phase !== "ready") return;
      els.timerChip.style.display = "none";

      const items = [...els.memoryStack.querySelectorAll(".ingredient")];
      if (!items.length) return;

      const playOnce = () => {
        if (phase !== "ready") return;
        items.forEach(item => item.classList.remove("demo-pop"));
        items.forEach((item, index) => {
          tutorialTimers.push(setTimeout(() => {
            if (phase !== "ready") return;
            items.forEach(node => node.classList.remove("demo-pop"));
            item.classList.remove("demo-pop");
            void item.offsetWidth;
            item.classList.add("demo-pop");
            tutorialTimers.push(setTimeout(() => {
              item.classList.remove("demo-pop");
            }, 620));
          }, index * 760));
        });
      };

      playOnce();
      tutorialTimers.push(setTimeout(function loopDemo() {
        if (phase !== "ready") return;
        playOnce();
        tutorialTimers.push(setTimeout(loopDemo, Math.max(3000, items.length * 760 + 900)));
      }, Math.max(3000, items.length * 760 + 900)));
    }

    function renderSlots() {
      els.slots.innerHTML = "";
      const positions = layoutFor(answerSequence.length);
      answerSequence.forEach((_, index) => {
        const slot = document.createElement("button");
        slot.type = "button";
        slot.className = `slot ${playerSequence[index] ? "is-filled" : ""} ${selectedIngredient ? "is-target" : ""} ${mistakeIndexes.has(index) ? "is-wrong" : ""}`;
        slot.draggable = !!playerSequence[index];
        slot.style.setProperty("--x", `${positions[index].x}%`);
        slot.style.setProperty("--y", `${positions[index].y}%`);
        slot.style.zIndex = String(index + 2);
        slot.dataset.index = String(index);
        slot.setAttribute("aria-label", `${index + 1}번째 재료`);
        slot.addEventListener("click", () => {
          if (selectedIngredient) {
            setIngredient(index, selectedIngredient);
            return;
          }
          removeAt(index);
        });
        slot.addEventListener("dragstart", event => {
          if (!playerSequence[index]) {
            event.preventDefault();
            return;
          }
          draggedSlotIndex = index;
          slot.classList.add("is-slot-dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("application/x-nollpic-slot", String(index));
          event.dataTransfer.setData("text/plain", playerSequence[index]);
        });
        slot.addEventListener("dragend", () => {
          draggedSlotIndex = null;
          slot.classList.remove("is-slot-dragging");
        });
        slot.addEventListener("dragover", event => event.preventDefault());
        slot.addEventListener("drop", event => {
          event.preventDefault();
          const sourceSlot = event.dataTransfer.getData("application/x-nollpic-slot");
          if (sourceSlot !== "") {
            moveSlotIngredient(Number(sourceSlot), index);
            return;
          }
          const key = event.dataTransfer.getData("text/plain");
          if (key) setIngredient(index, key);
        });
        if (playerSequence[index]) slot.appendChild(ingredientEl(playerSequence[index]));
        els.slots.appendChild(slot);
      });
    }

    function moveSlotIngredient(fromIndex, toIndex) {
      if (phase !== "make") return;
      if (!Number.isInteger(fromIndex) || !Number.isInteger(toIndex)) return;
      if (fromIndex === toIndex) return;
      const moving = playerSequence[fromIndex];
      if (!moving) return;

      const target = playerSequence[toIndex];
      playerSequence[toIndex] = moving;
      playerSequence[fromIndex] = target || null;
      mistakeIndexes.delete(fromIndex);
      mistakeIndexes.delete(toIndex);
      selectedIngredient = null;
      draggedSlotIndex = null;
      afterInput();
    }

    function renderTray() {
      els.tray.innerHTML = "";
      els.tray.style.setProperty("--tray-count", String(Math.max(3, traySequence.length)));
      els.tray.style.setProperty("--tray-columns", String(traySequence.length >= 6 ? 3 : Math.max(3, traySequence.length)));
      traySequence.forEach((key, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `ingredient-btn ${selectedIngredient === key ? "selected" : ""}`;
        btn.draggable = false;
        btn.dataset.key = key;
        btn.appendChild(ingredientEl(key));
        const label = document.createElement("span");
        label.textContent = ingredients[key].label;
        btn.appendChild(label);
        btn.addEventListener("click", event => {
          if (suppressTrayClick) {
            event.preventDefault();
            return;
          }
          selectIngredient(key);
        });
        btn.addEventListener("pointerdown", event => beginTouchDrag(event, key, btn));
        els.tray.appendChild(btn);
      });
    }

    function beginTouchDrag(event, key, button) {
      if (phase !== "make") return;
      event.preventDefault();

      const startX = event.clientX;
      const startY = event.clientY;
      let moved = false;
      const ghost = ingredientEl(key);
      ghost.classList.add("drag-ghost");
      document.body.appendChild(ghost);
      button.classList.add("is-dragging");
      button.setPointerCapture?.(event.pointerId);

      function moveGhost(x, y) {
        ghost.style.left = `${x}px`;
        ghost.style.top = `${y}px`;
      }

      function onMove(moveEvent) {
        const dx = moveEvent.clientX - startX;
        const dy = moveEvent.clientY - startY;
        if (Math.hypot(dx, dy) > 8) moved = true;
        moveGhost(moveEvent.clientX, moveEvent.clientY);
      }

    function onUp(upEvent) {
        suppressTrayClick = true;
        window.setTimeout(() => {
          suppressTrayClick = false;
        }, 120);
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        button.releasePointerCapture?.(event.pointerId);
        ghost.remove();
        button.classList.remove("is-dragging");

        if (!moved) {
          selectIngredient(key);
          return;
        }

        const slot = findSlotAt(upEvent.clientX, upEvent.clientY);
        if (slot && slot.dataset.index) {
          setIngredient(Number(slot.dataset.index), key);
          return;
        }

        selectedIngredient = null;
        renderSlots();
        renderTray();
        els.feedback.className = "feedback";
        els.feedback.textContent = "빈칸 위에서 손을 떼면 재료가 들어가요.";
      }

      moveGhost(startX, startY);
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    }

    function findSlotAt(x, y) {
      const target = document.elementFromPoint(x, y);
      const directSlot = target ? target.closest(".slot") : null;
      if (directSlot) return directSlot;

      const slots = [...els.slots.querySelectorAll(".slot")];
      const containing = slots.filter(slot => {
        const rect = slot.getBoundingClientRect();
        return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      });
      if (containing.length) {
        return containing.sort((a, b) => {
          const aRect = a.getBoundingClientRect();
          const bRect = b.getBoundingClientRect();
          return Math.abs(y - (aRect.top + aRect.height / 2)) - Math.abs(y - (bRect.top + bRect.height / 2));
        })[0];
      }
      return null;
    }

    function selectIngredient(key) {
      if (phase !== "make") return;
      selectedIngredient = selectedIngredient === key ? null : key;
      renderSlots();
      renderTray();
      els.feedback.className = "feedback";
      els.feedback.textContent = selectedIngredient ? `${ingredients[key].label} 선택` : "재료를 골라주세요.";
    }

    function setIngredient(index, key) {
      if (phase !== "make") return;
      playerSequence[index] = key;
      mistakeIndexes.delete(index);
      selectedIngredient = null;
      afterInput();
    }

    function removeAt(index) {
      if (phase !== "make") return;
      playerSequence[index] = null;
      mistakeIndexes.delete(index);
      afterInput();
    }

    function afterInput() {
      renderSlots();
      renderTray();
      const filledCount = playerSequence.filter(Boolean).length;
      els.feedback.className = "feedback";
      els.feedback.textContent = `${filledCount} / ${answerSequence.length}개 놓았어요.`;
      if (filledCount === answerSequence.length) checkAnswer();
    }

    function sameSequence(left, right) {
      return left.length === right.length && left.every((key, index) => key === right[index]);
    }

    function checkAnswer() {
      const ok = sameSequence(playerSequence, answerSequence);
      if (!ok) {
        if (
          mode === "middle" &&
          activeSwapRule &&
          (activeSwapRule.type === "swap" || Number.isInteger(activeSwapRule.a)) &&
          sameSequence(playerSequence, memorySequence)
        ) {
          mistakeIndexes = new Set([activeSwapRule.a, activeSwapRule.b]);
          renderSlots();
          els.feedback.className = "feedback";
          els.feedback.textContent = `기억한 순서예요. ${activeSwapRule.note}`;
          return;
        }
        mistakeIndexes = new Set(
          playerSequence
            .map((key, index) => key !== answerSequence[index] ? index : null)
            .filter(index => index !== null)
        );
        renderSlots();
        renderTray();
        els.feedback.className = "feedback bad";
        els.feedback.textContent = "틀렸어요. 빨간 칸을 눌러 지우거나 다른 재료로 바꿔보세요.";
        selectedIngredient = null;
        return;
      }
      mistakeIndexes = new Set();
      finishRound();
    }

    function answerLabelText() {
      return answerSequence.map(key => ingredients[key].label).join(", ");
    }

    function memoryLabelText() {
      return memorySequence.map(key => ingredients[key].label).join(" > ");
    }

    function setSequenceStrip(visible) {
      els.sequenceStrip.classList.toggle("is-visible", visible);
      els.sequenceStrip.textContent = visible ? memoryLabelText() : "";
    }

    function setMissionSubText(text) {
      els.missionSub.className = "mission-sub";
      els.missionSub.textContent = text;
    }

    function missionTitleText() {
      if (activeSwapRule?.title) {
        return activeSwapRule.title;
      }
      if (activeSwapRule?.type === "swap" || (activeSwapRule && Number.isInteger(activeSwapRule.a))) {
        return `${activeSwapRule.a + 1}번과 ${activeSwapRule.b + 1}번을 바꿔라`;
      }
      if (mode === "easy") {
        return "\uC608\uC2DC \uC21C\uC11C\uB97C \uC798 \uAE30\uC5B5\uD558\uACE0, \uC21C\uC11C\uB300\uB85C \uC62C\uB824\uBCF4\uC138\uC694.";
      }
      return currentMode().mission;
    }

    function setMissionRuleGuide() {
      els.missionSub.className = "mission-sub rule-highlight";
      if (activeSwapRule?.type === "swap" || (activeSwapRule && Number.isInteger(activeSwapRule.a))) {
        const left = activeSwapRule.a + 1;
        const right = activeSwapRule.b + 1;
        els.missionSub.innerHTML = `
          <span class="rule-chip strong">${left}번</span>
          <span class="rule-arrow">⇄</span>
          <span class="rule-chip strong">${right}번</span>
          <span class="rule-chip">${activeSwapRule.keep}</span>
          <span class="rule-note">${activeSwapRule.note}</span>
        `;
        return;
      }

      const ingredientName = activeSwapRule?.key ? ingredients[activeSwapRule.key].label : "주문";
      els.missionSub.innerHTML = `
        <span class="rule-chip strong">${ingredientName}</span>
        <span class="rule-chip">${activeSwapRule.keep || "손님 주문"}</span>
        <span class="rule-note">${activeSwapRule.note}</span>
      `;
    }

    function setMissionGuide() {
      if (activeSwapRule) {
        setMissionRuleGuide();
        return;
      }
      setMissionSubText(ruleGuideText());
    }

    function ruleGuideText() {
      const cfg = currentMode();
      if (activeSwapRule?.note) {
        return activeSwapRule.note;
      }
      if (activeSwapRule?.type === "swap" || (activeSwapRule && Number.isInteger(activeSwapRule.a))) {
        return `${activeSwapRule.a + 1}번과 ${activeSwapRule.b + 1}번 위치를 바꿔 ${answerSequence.length}칸을 채워요.`;
      }
      return `기억한 ${cfg.dish} 재료 ${answerSequence.length}개를 순서대로 넣어요.`;
    }

    function setProgress(step) {
      const names = [
        "1단계 기억하기",
        "2단계 집중하기",
        "3단계 미션 공개",
        "4단계 드래그 제작",
        "5단계 완성"
      ];
      els.stepName.textContent = names[step - 1];
      els.progressBar.style.width = `${step * 20}%`;
      els.roundInfo.textContent = `${round} / ${currentMode().rounds}`;
    }

    function showRemember() {
      clearTutorialDemo();
      phase = "remember";
      setProgress(1);
      applyModeUi();
      makeSequence();
      renderMemory();
      els.stageCard.style.display = "flex";
      els.stageCard.classList.remove("is-making");
      els.resultCard.style.display = "none";
      els.board.style.display = "grid";
      els.board.classList.remove("hidden-mode");
      els.board.classList.remove("show-example");
      els.plate.style.display = "grid";
      els.focusWrap.style.display = "none";
      els.orderArea.style.display = "none";
      els.timerChip.style.display = "inline-flex";
      els.missionLabel.textContent = memoryStageLabelText();
      els.missionText.textContent = memoryPromptText();
      if (showSequenceTextForCurrentMode()) {
        setMissionSubText("글씨와 그림을 함께 보고 재료 순서를 기억해요.");
        setSequenceStrip(true);
      } else {
        setMissionSubText("그림 위치를 보고 재료 순서를 기억해요.");
        setSequenceStrip(false);
      }
      els.nextBtn.disabled = true;
      els.nextBtn.textContent = "기억 중";
      if (rememberSeconds() <= 0) {
        els.timerChip.style.display = "none";
        window.setTimeout(showMake, 120);
      } else {
        countDown(rememberSeconds(), showMake);
      }
    }

    function showFocus() {
      phase = "focus";
      setProgress(2);
      els.stageCard.classList.remove("is-making");
      els.board.style.display = "grid";
      els.board.classList.add("hidden-mode");
      els.plate.style.display = "none";
      els.focusWrap.style.display = "block";
      els.focusWrap.classList.remove("is-auto");
      els.orderArea.style.display = "none";
      els.missionLabel.textContent = "잠깐 집중";
      els.missionText.textContent = "재료가 사라졌어요.";
      if (showSequenceTextForCurrentMode()) {
        setMissionSubText("2단계까지는 전체 순서를 다시 확인할 수 있어요.");
        setSequenceStrip(true);
      } else {
        setMissionSubText("방금 본 그림 순서를 떠올려 보세요.");
        setSequenceStrip(false);
      }
      els.nextBtn.disabled = true;
      els.nextBtn.textContent = "집중 중";
      countDown(3, () => {
        if (activeSwapRule) showMission();
        else showMake();
      });
    }

    function showMission() {
      phase = "mission";
      setProgress(3);
      els.timerChip.style.display = "none";
      els.board.style.display = "none";
      els.board.classList.add("hidden-mode");
      els.plate.style.display = "none";
      els.focusWrap.style.display = "none";
      els.focusWrap.classList.remove("is-auto");
      els.orderArea.style.display = "none";
      setSequenceStrip(mode === "middle");
      els.missionLabel.textContent = `${modes[mode].label} 미션`;
      els.missionText.textContent = missionTitleText();
      setMissionGuide();
      els.nextBtn.disabled = true;
      els.nextBtn.textContent = "정답 준비";
      clearInterval(timer);
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (phase === "mission") showMake();
      }, missionSpinMs);
    }

    function showMake() {
      phase = "make";
      clearInterval(timer);
      clearTimeout(timer);
      setProgress(2);
      els.stageCard.classList.add("is-making");
      els.board.classList.remove("hidden-mode");
      els.board.style.display = "none";
      els.plate.style.display = "none";
      els.focusWrap.style.display = "none";
      els.focusWrap.classList.remove("is-auto");
      els.orderArea.style.display = "flex";
      setSequenceStrip(false);
      els.missionLabel.textContent = `${currentMode().dish} 만들기`;
      els.missionText.textContent = missionTitleText();
      setMissionGuide();
      els.feedback.className = "feedback";
      els.feedback.textContent = `${answerLabelText()}를 빈칸에 끌어 넣어요.`;
      els.nextBtn.disabled = true;
      els.nextBtn.textContent = "만드는 중";
      renderSlots();
      renderTray();
    }

    function finishRound() {
      phase = "done";
      playWowSound();
      setProgress(5);
      streak += 1;
      score += mode === "easy" ? 90 : mode === "middle" ? 130 : 170;
      els.stageCard.classList.remove("is-making");
      els.stageCard.style.display = "none";
      setSequenceStrip(false);
      els.resultCard.style.display = "flex";
      const nextMode = round >= currentMode().rounds ? nextModeKey() : null;
      const isFinalMission = round >= currentMode().rounds && !nextMode;
      els.resultTitle.textContent = isFinalMission ? "오늘의 미션끝!" : `${currentMode().dish} 완성!`;
      els.resultText.textContent = isFinalMission
        ? "+200P 적립 성공! 잘했어요! 내일 또 만나요!"
        : nextMode
          ? `${modes[mode].label} 완료. 다음은 ${modes[nextMode].label} ${modes[nextMode].dish}이에요.`
          : `${modes[mode].label} ${round}문항 성공. 작업기억력 XP +15`;
      els.scoreText.textContent = String(score);
      els.streakText.textContent = String(streak);
      els.nextBtn.disabled = false;
      els.nextBtn.textContent = nextDoneButtonText();
      els.nextBtn.classList.add("orange");
      const copy = resultCopy(nextMode);
      els.resultTitle.textContent = copy.title;
      els.resultText.textContent = copy.text;
      updatePointRewardUi(isFinalMission);
      if (isFinalMission) {
        els.resetBtn.textContent = "다시하기";
        els.nextBtn.textContent = "오늘은 여기까지";
      } else {
        els.resetBtn.textContent = round >= currentMode().rounds ? "\uC624\uB298\uC740 \uC5EC\uAE30\uAE4C\uC9C0" : "\uB2E4\uC2DC";
      }
      popConfetti();
    }

    function countDown(seconds, done) {
      clearInterval(timer);
      clearTimeout(timer);
      placeTimerAboveBoard();
      els.timerChip.style.display = "inline-flex";
      let left = seconds;
      els.timerChip.textContent = String(left);
      playTimerBeep();
      timer = setInterval(() => {
        left -= 1;
        els.timerChip.textContent = String(Math.max(0, left));
        if (left > 0) playTimerBeep();
        if (left <= 0) {
          clearInterval(timer);
          done();
        }
      }, 1000);
    }

    function nextAction() {
      if (phase === "ready") {
        if (rememberSeconds() <= 0) showMake();
        else showRemember();
      }
      else if (phase === "mission") showMake();
      else if (phase === "done") {
        if (isCourseFinalDone()) {
          goBackToChallenge();
          return;
        }
        if (round >= currentMode().rounds) {
          const nextMode = nextModeKey();
          if (!nextMode) {
            goBackToChallenge();
            return;
          }
          if (nextMode) mode = nextMode;
          round = 1;
          setActiveLevelChip();
        } else {
          round += 1;
        }
        els.nextBtn.classList.remove("orange");
        if (rememberSeconds() <= 0) retryCurrentQuestion();
        else showRemember();
      }
    }

    function secondaryAction() {
      if (isCourseFinalDone()) {
        restartFromSushiWorkshop();
        return;
      }
      if (phase === "done" && round >= currentMode().rounds) {
        goBackToChallenge();
        return;
      }
      retryCurrentQuestion();
    }

    function resetGame() {
      clearInterval(timer);
      clearTimeout(timer);
      clearTutorialDemo();
      phase = "ready";
      round = 1;
      streak = 0;
      score = 0;
      playerSequence = [];
      selectedIngredient = null;
      traySequence = [];
      mistakeIndexes = new Set();
      applyModeUi();
      setProgress(1);
      els.stageCard.classList.remove("is-making");
      els.stageCard.style.display = "flex";
      els.resultCard.style.display = "none";
      updatePointRewardUi(false);
      els.board.style.display = "grid";
      els.board.classList.remove("hidden-mode");
      els.board.classList.add("show-example");
      els.plate.style.display = "grid";
      els.focusWrap.style.display = "none";
      els.focusWrap.classList.remove("is-auto");
      els.orderArea.style.display = "none";
      setSequenceStrip(false);
      els.timerChip.style.display = rememberSeconds() > 0 ? "inline-flex" : "none";
      els.timerChip.textContent = String(rememberSeconds());
      els.missionLabel.textContent = memoryStageLabelText();
      els.missionText.textContent = memoryPromptText();
      setMissionSubText("재료가 사라진 뒤 같은 순서로 넣으면 완성됩니다.");
      els.nextBtn.disabled = false;
      els.nextBtn.textContent = "시작하기";
      els.nextBtn.classList.remove("orange");
      els.resetBtn.textContent = "\uB2E4\uC2DC";
      makeSequence();
      renderMemory();
      els.missionLabel.textContent = memoryStageLabelText();
      els.missionText.textContent = memoryPromptText();
      els.nextBtn.textContent = "시작하기";
      setReadyTutorialCopy();
      startTutorialDemo();
    }

    function retryCurrentQuestion() {
      clearInterval(timer);
      clearTimeout(timer);
      clearTutorialDemo();
      phase = "ready";
      playerSequence = [];
      selectedIngredient = null;
      traySequence = [];
      mistakeIndexes = new Set();
      applyModeUi();
      setProgress(1);
      els.stageCard.classList.remove("is-making");
      els.stageCard.style.display = "flex";
      els.resultCard.style.display = "none";
      updatePointRewardUi(false);
      els.board.style.display = "grid";
      els.board.classList.remove("hidden-mode");
      els.board.classList.add("show-example");
      els.plate.style.display = "grid";
      els.focusWrap.style.display = "none";
      els.focusWrap.classList.remove("is-auto");
      els.orderArea.style.display = "none";
      setSequenceStrip(false);
      els.timerChip.style.display = rememberSeconds() > 0 ? "inline-flex" : "none";
      els.timerChip.textContent = String(rememberSeconds());
      els.missionLabel.textContent = memoryStageLabelText();
      els.missionText.textContent = memoryPromptText();
      setMissionSubText("현재 문항을 다시 시작해요.");
      els.nextBtn.disabled = false;
      els.nextBtn.textContent = "시작하기";
      els.nextBtn.classList.remove("orange");
      els.resetBtn.textContent = "\uB2E4\uC2DC";
      makeSequence();
      renderMemory();
      els.missionLabel.textContent = memoryStageLabelText();
      els.missionText.textContent = memoryPromptText();
      els.nextBtn.textContent = "시작하기";
      setReadyTutorialCopy();
      startTutorialDemo();
    }

    function popConfetti() {
      els.confetti.innerHTML = "";
      const colors = ["#ff6b00", "#1297dc", "#ffd43b", "#2fb356", "#ff80b4"];
      for (let i = 0; i < 24; i += 1) {
        const piece = document.createElement("i");
        piece.style.setProperty("--x", `${Math.random() * 100}%`);
        piece.style.setProperty("--d", `${1.2 + Math.random() * 1.2}s`);
        piece.style.setProperty("--c", colors[i % colors.length]);
        els.confetti.appendChild(piece);
      }
      setTimeout(() => {
        els.confetti.innerHTML = "";
      }, 2500);
    }

    document.querySelectorAll(".level-chip").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".level-chip").forEach(chip => chip.classList.remove("active"));
        button.classList.add("active");
        mode = button.dataset.mode;
        resetGame();
      });
    });

    els.nextBtn.addEventListener("click", nextAction);
    els.resetBtn.addEventListener("click", secondaryAction);
    els.pointRewardBtn?.addEventListener("click", claimTodayPoint);
    resetGame();
  </script>
