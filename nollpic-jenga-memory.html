<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>놀픽 모양기억 놀이</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Pretendard";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-display: swap;
    }

    :root {
      --ink: #0e1d3e;
      --muted: #657085;
      --orange: #ff6b16;
      --orange-dark: #e95709;
      --sky: #49c3f1;
      --blue: #1788d8;
      --pink: #ff6f91;
      --card: rgba(255, 255, 255, .96);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: #eef3f8;
      display: grid;
      place-items: center;
    }

    .phone {
      position: relative;
      width: min(100%, 420px);
      height: 100%;
      min-height: 0;
      padding: 12px 14px 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 8%, rgba(255, 107, 22, .12), transparent 26%),
        linear-gradient(180deg, #fffafa 0%, #ffffff 46%, #eef8fc 100%);
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 4px 14px;
    }

    .back {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 14px;
      background: #fff4ee;
      color: var(--orange);
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
    }

    .title {
      flex: 1;
    }

    .title small {
      display: block;
      color: var(--orange);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .title h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .skill {
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 1px solid rgba(255, 107, 22, .28);
      border-radius: 999px;
      background: #fff8f2;
      color: var(--orange-dark);
      font-size: 11px;
      font-weight: 900;
    }

    .mission {
      padding: 16px;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 18px 34px rgba(14, 29, 62, .10);
    }

    .mission-top {
      display: grid;
      grid-template-columns: 1fr 76px;
      gap: 12px;
      align-items: stretch;
    }

    .target-card {
      min-height: 104px;
      padding: 14px;
      border: 2px solid rgba(14, 29, 62, .08);
      border-radius: 20px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .target-card strong {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 19px;
      background: linear-gradient(180deg, #fff7d7, #ffe19a);
      border: 3px solid #ffc247;
      color: var(--orange);
      font-size: 34px;
      font-weight: 900;
      box-shadow: inset 0 -5px 0 rgba(255, 107, 22, .10);
    }

    .target-card span {
      display: block;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .target-card b {
      display: block;
      font-size: 19px;
      line-height: 1.25;
      word-break: keep-all;
    }

    .timer {
      border-radius: 20px;
      border: 3px solid #9ee9f2;
      background: #ecfbff;
      display: grid;
      place-items: center;
      text-align: center;
      color: #1090bd;
      font-weight: 900;
      box-shadow: inset 0 -5px 0 rgba(73, 195, 241, .12);
    }

    .timer small {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .timer strong {
      display: block;
      font-size: 34px;
      line-height: .95;
    }

    .stage {
      margin-top: 16px;
      padding: 14px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 50% 8%, rgba(255,255,255,.46), transparent 34%),
        linear-gradient(180deg, #f7fbff 0%, #eaf7ff 100%);
      min-height: min(398px, calc(100dvh - 282px));
      box-shadow: 0 18px 34px rgba(14, 29, 62, .10);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .prompt {
      min-height: min(344px, calc(100dvh - 336px));
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      display: grid;
      place-items: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(14, 29, 62, .06);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.8);
    }

    .prompt::before {
      content: "5초 동안 기억해요";
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff4ee;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 900;
    }

    .prompt.is-hidden::before {
      content: "실제 젠가로 만들어봐요";
    }

    .target-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .target-image-wrap {
      width: min(310px, 94%);
      height: min(274px, calc(100dvh - 410px));
      min-height: 190px;
      margin-top: 26px;
      border-radius: 22px;
    }

    .prompt.is-hidden .target-image-wrap {
      filter: blur(9px);
      opacity: .3;
    }

    .cover-text {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding-top: 24px;
      color: var(--ink);
      font-size: 21px;
      font-weight: 900;
      text-align: center;
      background: rgba(255,255,255,.68);
    }

    .prompt.is-hidden .cover-text {
      display: grid;
    }

    .build-note {
      margin: 12px 6px 0;
      color: #4d5a6e;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.45;
      text-align: center;
      word-break: keep-all;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      height: 54px;
      border: 0;
      border-radius: 18px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 9px 0 rgba(14, 29, 62, .12);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 6px 0 rgba(14, 29, 62, .12);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, .94);
      color: var(--ink);
      border: 1px solid rgba(14, 29, 62, .12);
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .feedback {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      z-index: 4;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(14, 29, 62, .80);
      color: white;
      font-size: 16px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .feedback.show {
      opacity: 1;
      transform: translate(-50%, -62%);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 26px;
      background: rgba(14, 29, 62, .55);
      backdrop-filter: blur(5px);
    }

    .overlay.hide {
      display: none;
    }

    .overlay .hide {
      display: none !important;
    }

    .panel {
      width: min(100%, 340px);
      padding: 30px 22px 22px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 22px 48px rgba(14, 29, 62, .26);
      text-align: center;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 25px;
      line-height: 1.15;
    }

    .panel p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.55;
    }

    .panel .btn {
      width: 100%;
    }

    .point-reward-btn {
      width: 100%;
      min-height: 52px;
      margin: 0 0 12px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(180deg, #ff8a24, #ff651a);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(255, 107, 0, .22);
    }

    .point-reward-btn.claimed {
      background: #eef2f7;
      color: #536079;
      box-shadow: none;
    }

    .overlay-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .overlay-actions:has(.btn-secondary:not(.hide)) {
      grid-template-columns: 1fr 1fr;
    }

    body[data-phase="build"] .mission-top {
      grid-template-columns: 1fr;
    }

    body[data-phase="build"] .timer {
      display: none;
    }

    body[data-phase="build"] .target-card {
      justify-content: flex-start;
      text-align: left;
    }

    body[data-phase="build"] .target-card strong {
      display: grid;
    }

    .point-burst,
    .point-coin {
      position: absolute;
      left: 50%;
      pointer-events: none;
    }

    .point-burst {
      top: 50%;
      z-index: 12;
      color: var(--orange);
      font-size: 28px;
      font-weight: 900;
      text-shadow: 0 3px 0 rgba(255,255,255,.95);
      animation: pointBurst 920ms ease-out forwards;
    }

    .point-coin {
      top: 52%;
      z-index: 11;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #fff5a8, #ffc53d 58%, #f7931e 100%);
      animation: pointCoin 880ms ease-out forwards;
    }

    @keyframes pointBurst {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(.82); }
      20% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(1); }
    }

    @keyframes pointCoin {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -62px) rotate(260deg); }
    }

    @media (max-width: 380px) {
      .phone {
        padding: 10px 10px 6px;
      }

      .target-card {
        gap: 10px;
      }

      .target-card strong {
        width: 58px;
        height: 58px;
        font-size: 30px;
      }

      .target-card b {
        font-size: 17px;
      }

      .stage {
        min-height: min(374px, calc(100dvh - 270px));
      }
    }

    @media (max-height: 720px) {
      header { margin-bottom: 8px; }
      .mission { padding: 12px; }
      .target-card { min-height: 88px; padding: 10px; }
      .target-card strong { width: 56px; height: 56px; font-size: 30px; }
      .stage { margin-top: 10px; padding: 10px; }
      .actions { margin-top: 9px; }
      .btn { height: 48px; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <header>
      <button class="back" type="button" aria-label="뒤로가기" onclick="exitToChallenge()">‹</button>
      <div class="title">
        <small>오늘의 미션</small>
        <h1>모양기억 놀이</h1>
      </div>
      <span class="skill">시각탐색 · 보통</span>
    </header>

    <section class="mission" aria-label="미션 정보">
      <div class="mission-top">
        <div class="target-card">
          <strong id="levelNumber">1</strong>
          <div>
            <span id="levelMeta">레벨 1 · 0/3 성공</span>
            <b id="targetTitle">5초 보고 젠가로 만들기</b>
          </div>
        </div>
        <div class="timer">
          <div>
            <small id="timerLabel">기억시간</small>
            <strong id="timerValue">5</strong>
            <small>초</small>
          </div>
        </div>
      </div>
    </section>

    <section class="stage">
      <div class="prompt" id="prompt">
        <div class="target-image-wrap">
          <img class="target-image" id="targetImage" alt="기억할 젠가 모양">
        </div>
        <div class="cover-text">기억한 모양을<br>젠가로 만들어봐요</div>
      </div>
      <p class="build-note" id="buildNote">예시를 자세히 보고, 사라지면 실제 젠가로 같은 모양을 만들어요.</p>
    </section>

    <div class="actions">
      <button class="btn btn-secondary" type="button" onclick="restartRound()">다시 보기</button>
      <button class="btn btn-primary" type="button" id="startBtn" onclick="primaryAction()">시작하기</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <section class="overlay" id="overlay">
      <div class="panel">
        <h2 id="overlayTitle">모양기억 놀이</h2>
        <p id="overlayText">5초 동안 젠가 모양을 크게 보고<br>실제 젠가로 같은 모양을 만들어요.</p>
        <button class="point-reward-btn hide" type="button" id="pointRewardBtn">오늘의 포인트 받기 200P</button>
        <div class="overlay-actions">
          <button class="btn btn-secondary hide" type="button" id="retryBtn">다시하기</button>
          <button class="btn btn-primary" type="button" id="overlayBtn">시작하기</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const levels = [
      { name: "같은 방향 · 도형 4개", images: ["jenga-level1-1.webp", "jenga-level1-2.webp", "jenga-level1-3.webp"] },
      { name: "같은 방향 · 도형 6개", images: ["jenga-level2-1.webp", "jenga-level2-2.webp", "jenga-level2-3.webp"] },
      { name: "다른 방향 · 도형 4개", images: ["jenga-level3-1.webp", "jenga-level3-2.webp", "jenga-level3-3.webp"] },
      { name: "다른 방향 · 도형 6개", images: ["jenga-level4-1.webp", "jenga-level4-2.webp", "jenga-level4-3.webp"] },
      { name: "어려운 형태", images: ["jenga-level5-1.webp", "jenga-level5-2.webp", "jenga-level5-3.webp"] }
    ];

    const imageBase = "images/jenga-shapes/";
    const allImages = levels.flatMap((level, levelIndex) => level.images.map((file, roundIndex) => ({
      file,
      levelIndex,
      roundIndex
    })));

    const els = {
      levelNumber: document.getElementById("levelNumber"),
      levelMeta: document.getElementById("levelMeta"),
      targetTitle: document.getElementById("targetTitle"),
      timerLabel: document.getElementById("timerLabel"),
      timerValue: document.getElementById("timerValue"),
      prompt: document.getElementById("prompt"),
      targetImage: document.getElementById("targetImage"),
      buildNote: document.getElementById("buildNote"),
      feedback: document.getElementById("feedback"),
      overlay: document.getElementById("overlay"),
      overlayTitle: document.getElementById("overlayTitle"),
      overlayText: document.getElementById("overlayText"),
      overlayBtn: document.getElementById("overlayBtn"),
      retryBtn: document.getElementById("retryBtn"),
      pointRewardBtn: document.getElementById("pointRewardBtn"),
      startBtn: document.getElementById("startBtn")
    };

    let level = 0;
    let round = 0;
    let current = null;
    let accepting = false;
    let phase = "intro";
    let timer = null;
    let feedbackTimer = null;
    let pointClaimed = false;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateText() {
      const cfg = levels[level];
      els.levelNumber.textContent = String(level + 1);
      els.levelMeta.textContent = `레벨 ${level + 1} · ${round}/${cfg.images.length} 성공`;
      els.targetTitle.textContent = `${cfg.name} 만들기`;
    }

    function levelIntroText() {
      const descriptions = [
        "이번에는 같은 방향으로 된 도형 4개의 모양을 보여줄 거예요.",
        "이번에는 같은 방향으로 된 도형 6개의 모양을 보여줄 거예요.",
        "이번에는 다른 방향이 섞인 도형 4개의 모양을 보여줄 거예요.",
        "이번에는 다른 방향이 섞인 도형 6개의 모양을 보여줄 거예요.",
        "이번에는 조금 더 어려운 젠가 모양을 보여줄 거예요."
      ];
      return descriptions[level] || descriptions[0];
    }

    function showLevelIntro() {
      clearInterval(timer);
      accepting = false;
      phase = "level-intro";
      document.body.dataset.phase = phase;
      updateText();
      els.timerLabel.textContent = "준비";
      els.timerValue.textContent = String(level + 1);
      els.prompt.classList.remove("is-hidden");
      current = pickCurrentImage();
      els.targetImage.src = `${imageBase}${current.file}`;
      els.buildNote.textContent = "설명을 듣고 나면 예시 모양을 5초 동안 보여줘요.";
      els.startBtn.textContent = "설명 확인";
      els.startBtn.disabled = false;
      els.overlayTitle.textContent = `레벨 ${level + 1} 안내`;
      els.overlayText.innerHTML = `${levelIntroText()}<br>${levels[level].name}를 잘 기억해보세요.`;
      els.pointRewardBtn.classList.add("hide");
      els.retryBtn.classList.add("hide");
      els.overlayBtn.textContent = "확인하기";
      els.overlay.classList.remove("hide");
    }

    function showFeedback(text, good = true) {
      clearTimeout(feedbackTimer);
      els.feedback.textContent = text;
      els.feedback.style.background = good ? "rgba(24, 183, 122, .9)" : "rgba(239, 68, 68, .9)";
      els.feedback.classList.add("show");
      feedbackTimer = setTimeout(() => els.feedback.classList.remove("show"), 850);
    }

    function audioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!window.nollpicAudioContext) window.nollpicAudioContext = new AudioContext();
      if (window.nollpicAudioContext.state === "suspended") window.nollpicAudioContext.resume();
      return window.nollpicAudioContext;
    }

    function playTone(frequency, startAt, duration, gainValue = 0.08, type = "sine") {
      const ctx = audioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, startAt);
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(gainValue, startAt + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startAt);
      osc.stop(startAt + duration + 0.02);
    }

    function playPointRewardSound() {
      const ctx = audioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      playTone(1046.5, now, 0.1, 0.08);
      playTone(1318.5, now + 0.09, 0.13, 0.08);
      playTone(1760, now + 0.21, 0.2, 0.07, "triangle");
    }

    function showPointRewardEffect() {
      els.overlay.querySelectorAll(".point-burst, .point-coin").forEach(node => node.remove());
      const burst = document.createElement("span");
      burst.className = "point-burst";
      burst.textContent = "+200P";
      els.overlay.appendChild(burst);
      [-44, -22, 20, 44].forEach((dx, index) => {
        const coin = document.createElement("span");
        coin.className = "point-coin";
        coin.style.setProperty("--dx", `${dx}px`);
        coin.style.animationDelay = `${index * 45}ms`;
        els.overlay.appendChild(coin);
      });
      setTimeout(() => els.overlay.querySelectorAll(".point-burst, .point-coin").forEach(node => node.remove()), 1100);
    }

    function claimPointReward() {
      if (pointClaimed) return;
      pointClaimed = true;
      try {
        if (window.parent && window.parent !== window && typeof window.parent.claimChallengeStepReward === "function") {
          window.parent.claimChallengeStepReward(3);
        }
      } catch (error) {}
      els.pointRewardBtn.textContent = "200P 받았어요";
      els.pointRewardBtn.classList.add("claimed");
      els.pointRewardBtn.disabled = true;
      playPointRewardSound();
      showPointRewardEffect();
    }

    function pickCurrentImage() {
      const cfg = levels[level];
      return {
        file: cfg.images[round],
        levelIndex: level,
        roundIndex: round
      };
    }

    function startRound() {
      clearInterval(timer);
      current = pickCurrentImage();
      accepting = false;
      phase = "memory";
      document.body.dataset.phase = phase;
      els.prompt.classList.remove("is-hidden");
      els.targetImage.src = `${imageBase}${current.file}`;
      els.buildNote.textContent = "예시를 자세히 보고, 사라지면 실제 젠가로 같은 모양을 만들어요.";
      els.startBtn.textContent = "기억 중";
      els.startBtn.disabled = true;
      updateText();

      let left = 5;
      els.timerLabel.textContent = "기억시간";
      els.timerValue.textContent = String(left);
      timer = setInterval(() => {
        left -= 1;
        els.timerValue.textContent = String(Math.max(0, left));
        if (left <= 0) {
          clearInterval(timer);
          phase = "build";
          document.body.dataset.phase = phase;
          accepting = true;
          els.prompt.classList.add("is-hidden");
          els.buildNote.textContent = "실제 젠가로 완성한 뒤 아래 버튼을 눌러요.";
          els.startBtn.textContent = "완성했어요";
          els.startBtn.disabled = false;
        }
      }, 1000);
    }

    function completeBuild() {
      if (!accepting) return;
      accepting = false;
      phase = "answer";
      document.body.dataset.phase = phase;
      els.prompt.classList.remove("is-hidden");
      els.timerLabel.textContent = "정답";
      els.timerValue.textContent = String(round + 1);
      els.levelMeta.textContent = `레벨 ${level + 1} · ${round + 1}/${levels[level].images.length} 성공`;
      els.buildNote.textContent = "정답 모양을 확인한 뒤 다음 버튼을 눌러요.";
      els.startBtn.textContent = "다음";
      els.startBtn.disabled = false;
      showFeedback("모양 완성!", true);
    }

    function advanceAfterAnswer() {
      round += 1;
      nextRound();
    }

    function nextRound() {
      if (round >= levels[level].images.length) {
        if (level >= levels.length - 1) {
          completeGame();
          return;
        }
        level += 1;
        round = 0;
        showLevelIntro();
        return;
      }
      startRound();
    }

    function completeGame() {
      clearInterval(timer);
      accepting = false;
      phase = "done";
      document.body.dataset.phase = phase;
      try {
        if (window.parent && window.parent !== window && typeof window.parent.completeChallengeStep === "function") {
          window.parent.completeChallengeStep(3);
        }
      } catch (error) {}
      els.overlayTitle.textContent = "오늘의 모양 미션 완료!";
      els.overlayText.innerHTML = `모양을 끝까지 잘 기억했어요.<br>실제 젠가로 차근차근 만들었어요.`;
      els.pointRewardBtn.classList.remove("hide");
      els.retryBtn.classList.remove("hide");
      els.pointRewardBtn.textContent = pointClaimed ? "200P 받았어요" : "오늘의 포인트 받기 200P";
      els.pointRewardBtn.classList.toggle("claimed", pointClaimed);
      els.pointRewardBtn.disabled = pointClaimed;
      els.overlayBtn.textContent = "오늘은 여기까지";
      els.overlay.classList.remove("hide");
      els.startBtn.textContent = "시작하기";
    }

    function startGame() {
      level = 0;
      round = 0;
      pointClaimed = false;
      els.pointRewardBtn.classList.add("hide");
      els.retryBtn.classList.add("hide");
      showLevelIntro();
    }

    function restartRound() {
      if (phase === "intro" || phase === "done") {
        startGame();
        return;
      }
      startRound();
    }

    function primaryAction() {
      if (phase === "level-intro") {
        els.overlay.classList.add("hide");
        startRound();
        return;
      }
      if (phase === "build") {
        completeBuild();
        return;
      }
      if (phase === "answer") {
        advanceAfterAnswer();
        return;
      }
      if (phase === "done") {
        startGame();
        return;
      }
      startGame();
    }

    function exitToChallenge() {
      try {
        if (window.parent && window.parent !== window && typeof window.parent.prevPage === "function") {
          window.parent.prevPage(11);
          return;
        }
      } catch (error) {}
      window.location.href = "index.html?page=challenge";
    }

    function goHome() {
      try {
        if (window.parent && window.parent !== window && typeof window.parent.prevPage === "function") {
          window.parent.prevPage(1);
          return;
        }
      } catch (error) {}
      window.location.href = "index.html";
    }

    els.overlayBtn.addEventListener("click", () => {
      if (phase === "done" && level >= levels.length - 1 && round >= levels[level].images.length) {
        goHome();
        return;
      }
      if (phase === "level-intro") {
        els.overlay.classList.add("hide");
        startRound();
        return;
      }
      startGame();
    });
    els.retryBtn.addEventListener("click", startGame);
    els.pointRewardBtn.addEventListener("click", claimPointReward);

    current = { file: levels[0].images[0], levelIndex: 0, roundIndex: 0 };
    els.targetImage.src = `${imageBase}${current.file}`;
    updateText();
  </script>
