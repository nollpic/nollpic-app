<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>놀픽 9칸 위치기억 놀이</title>
  <style>
    :root { --navy:#0e1d3e; --orange:#ff6b16; --red:#ef3552; --blue:#2474e8; --line:#c9d3df; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:Pretendard,"Malgun Gothic",sans-serif; color:var(--navy); background:#edf3f9; }
    button { font:inherit; }
    .app { width:100%; height:100%; display:flex; flex-direction:column; background:linear-gradient(180deg,#fff8f5 0 28%,#f1f8ff 64%,#eaf6ff 100%); }
    header { min-height:78px; display:flex; align-items:center; gap:12px; padding:16px 18px 10px; }
    .back { width:42px; height:42px; border:0; border-radius:15px; background:#fff0e8; color:var(--orange); font-size:29px; font-weight:900; cursor:pointer; }
    .title { flex:1; min-width:0; }
    .title small { color:var(--orange); font-size:12px; font-weight:900; }
    .title h1 { margin:2px 0 0; font-size:22px; line-height:1.1; font-weight:950; }
    .badge { padding:8px 10px; border:1px solid #ffbd91; border-radius:999px; color:#ed6413; background:#fff8f3; font-size:11px; font-weight:900; white-space:nowrap; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 18px 11px; padding:6px; border-radius:18px; background:#fff; box-shadow:0 8px 20px rgba(14,29,62,.06); }
    .tab { height:40px; border:0; border-radius:13px; background:#f0f3f7; color:#7b8493; font-size:13px; font-weight:900; cursor:pointer; }
    .tab.active { color:#fff; background:var(--orange); box-shadow:0 4px 10px rgba(255,107,22,.25); }
    .mission { margin:0 18px 10px; padding:13px 15px; border-radius:20px; background:#fff; border:2px solid #edf0f4; box-shadow:0 6px 16px rgba(14,29,62,.04); }
    .mission-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .mission strong { color:var(--orange); font-size:15px; font-weight:950; }
    .mission span { color:#6e7889; font-size:12px; font-weight:850; }
    .legend { display:none; }
    .legend i { display:flex; align-items:center; gap:5px; color:#64748b; font-style:normal; font-size:11px; font-weight:850; }
    .mini-x { font-size:20px; color:#111827; font-weight:400; }
    .mini-red { width:16px; height:16px; border-radius:50%; background:var(--red); }
    .mini-blue { width:17px; height:17px; border-radius:50%; background:var(--blue); }
    .play { flex:1; min-height:0; margin:0 18px 12px; padding:13px 14px 15px; border-radius:27px; background:rgba(255,255,255,.88); display:flex; flex-direction:column; align-items:center; box-shadow:inset 0 0 0 1px rgba(14,29,62,.04); }
    .instruction { width:100%; min-height:58px; padding:9px 13px; text-align:left; display:flex; align-items:center; justify-content:center; gap:9px; border-radius:17px; background:#fff5ee; color:#34445e; font-size:13px; line-height:1.4; font-weight:900; }
    .instruction::before { content:"🥤"; flex:0 0 auto; font-size:25px; }
    .board-wrap { flex:1; min-height:0; width:100%; padding:12px 0; display:flex; align-items:center; justify-content:center; }
    .board { width:min(82vw,286px); aspect-ratio:1/1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr)); border:3px solid #8796aa; border-radius:5px; overflow:hidden; background:#fff; box-shadow:0 12px 26px rgba(14,29,62,.12); }
    .cell { position:relative; min-width:0; min-height:0; width:100%; height:100%; border:1px solid #9ba9ba; background:#fff; display:grid; place-items:center; padding:0; cursor:default; }
    .cell:disabled { cursor:default; }
    .cell::before { content:""; width:56%; height:56%; transition:transform .12s ease; }
    .cell.x::before { content:"×"; width:auto; height:auto; color:#111827; font-family:Arial,sans-serif; font-size:48px; line-height:1; font-weight:400; transform:translateY(-1px); }
    .cell.red::before { border-radius:50%; background:var(--red); box-shadow:inset -5px -5px 0 rgba(160,21,45,.15); }
    .cell.blue::before { border-radius:50%; background:var(--blue); box-shadow:inset -5px -5px 0 rgba(10,70,160,.16); }
    .cell.good { animation:good .38s ease; background:#eafff1; }
    .cell.bad { animation:shake .3s ease; background:#fff0ed; }
    .bottom { width:100%; display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; }
    .btn { height:50px; border:0; border-radius:17px; font-size:15px; font-weight:950; cursor:pointer; }
    .secondary { display:none; }
    .primary { color:#fff; background:var(--orange); box-shadow:0 5px 0 #d9520b; }
    .feedback { min-height:21px; margin-top:8px; color:#16804b; text-align:center; font-size:12px; font-weight:950; }
    .overlay { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(14,29,62,.35); backdrop-filter:blur(5px); }
    .overlay.hide { display:none; }
    .panel { width:min(100%,340px); padding:27px 22px 22px; border-radius:28px; background:#fff; text-align:center; box-shadow:0 22px 60px rgba(14,29,62,.24); }
    .hero { font-size:58px; }
    .panel h2 { margin:7px 0 10px; font-size:24px; font-weight:950; }
    .panel p { margin:0 0 18px; color:#667085; font-size:14px; line-height:1.65; font-weight:750; }
    .panel button { width:100%; height:52px; border:0; border-radius:18px; background:var(--orange); color:#fff; font-weight:950; cursor:pointer; box-shadow:0 6px 0 #d95109; }
    .reward { display:none; margin-bottom:10px; height:46px!important; background:#fff3c8!important; color:#9b6500!important; box-shadow:none!important; }
    .reward.show { display:block; }
    @keyframes good { 50% { transform:scale(.94); } }
    @keyframes shake { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
    @media(max-height:720px){header{min-height:66px;padding-top:9px}.tabs{margin-bottom:7px}.mission{padding:10px 13px;margin-bottom:7px}.play{padding:9px 11px 12px}.instruction{min-height:50px}.board-wrap{padding:8px 0}.board{width:min(74vw,252px)}.cell.x::before{font-size:40px}.btn{height:46px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <button class="back" type="button" onclick="exitToChallenge()" aria-label="방학챌린지로 돌아가기">‹</button>
      <div class="title"><small>오늘의 미션</small><h1>9칸 위치기억 놀이</h1></div>
      <span class="badge">공간기억 · 보통</span>
    </header>
    <nav class="tabs" aria-label="난이도 선택">
      <button class="tab active" type="button" data-level="1">난이도 1</button>
      <button class="tab" type="button" data-level="2">난이도 2</button>
      <button class="tab" type="button" data-level="3">난이도 3</button>
    </nav>
    <section class="mission">
      <div class="mission-top"><strong id="levelTitle">X 자리만 비우기</strong><span id="progress">1/3 문제</span></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="play">
      <div class="instruction" id="instruction">종이컵 8개를 놓고 X 칸만 비워주세요.</div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="bottom">
        <button class="btn secondary" type="button" id="replayBtn">방법 보기</button>
        <button class="btn primary" type="button" id="checkBtn">완성했어요</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </section>
    <section class="overlay" id="overlay">
      <div class="panel">
        <div class="hero" id="overlayHero">🥤</div>
        <h2 id="overlayTitle">종이컵을 화면처럼 놓아요!</h2>
        <p id="overlayText">난이도 1은 종이컵 8개를 놓고 X 칸만 비워요.<br>난이도 2는 빨간 표시 위에 빨간 컵,<br>난이도 3은 파란 표시 위에 파란 컵도 놓아요.</p>
        <button class="reward" type="button" id="rewardBtn">오늘의 포인트 받기 200P</button>
        <button type="button" id="overlayBtn">놀이 시작</button>
      </div>
    </section>
  </main>
  <script>
    const configs = {
      1: { title:"X 자리만 비우기", types:["x"], counts:{x:1}, guide:"종이컵 8개를 올려놓고 X 칸만 비워주세요." },
      2: { title:"빈자리와 빨간 컵 맞추기", types:["x","red"], counts:{x:1,red:1}, guide:"X 칸은 비우고 빨간 표시에는 빨간 종이컵을 놓아주세요." },
      3: { title:"빨간 컵·파란 컵 맞추기", types:["x","red","blue"], counts:{x:1,red:1,blue:1}, guide:"X 칸은 비우고 빨간색과 파란색 컵을 표시 위치에 놓아주세요." }
    };
    const board = document.getElementById("board");
    const levelTitle = document.getElementById("levelTitle");
    const progress = document.getElementById("progress");
    const legend = document.getElementById("legend");
    const instruction = document.getElementById("instruction");
    const replayBtn = document.getElementById("replayBtn");
    const checkBtn = document.getElementById("checkBtn");
    const feedback = document.getElementById("feedback");
    const overlay = document.getElementById("overlay");
    const overlayHero = document.getElementById("overlayHero");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const overlayBtn = document.getElementById("overlayBtn");
    const rewardBtn = document.getElementById("rewardBtn");
    const tabs = [...document.querySelectorAll(".tab")];
    let level = 1;
    let problemIndex = 0;
    let patternSets = {};
    let answer = [];
    let completedLevels = new Set();
    let pointClaimed = false;
    let awaitingNext = false;

    function shuffle(values) {
      const copy = [...values];
      for (let i=copy.length-1;i>0;i-=1) { const j=Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
      return copy;
    }

    function makePattern(levelNumber) {
      const cfg = configs[levelNumber];
      const values = [];
      cfg.types.forEach(type => { for(let i=0;i<cfg.counts[type];i+=1) values.push(type); });
      while(values.length<9) values.push("");
      return shuffle(values);
    }

    function makeQuestionSet(levelNumber) {
      const pool = [];
      while(pool.length<10) pool.push(makePattern(levelNumber));
      const selected = [];
      const selectedKeys = new Set();
      shuffle(pool).forEach(pattern => {
        const key = pattern.join("|");
        if(selected.length<3 && !selectedKeys.has(key)) {
          selectedKeys.add(key);
          selected.push(pattern);
        }
      });
      while(selected.length<3) {
        const pattern = makePattern(levelNumber);
        const key = pattern.join("|");
        if(!selectedKeys.has(key)) {
          selectedKeys.add(key);
          selected.push(pattern);
        }
      }
      return selected;
    }

    function buildLegend() {
      const cfg = configs[level];
      const labels = {x:'<i><b class="mini-x">×</b>X 표시</i>',red:'<i><b class="mini-red"></b>빨간색</i>',blue:'<i><b class="mini-blue"></b>파란색</i>'};
      legend.innerHTML = cfg.types.map(type => labels[type]).join("");
    }

    function renderBoard(values) {
      board.innerHTML = values.map((value,index) => `<button class="cell ${value}" type="button" disabled aria-label="${index+1}번 칸"></button>`).join("");
    }

    function startProblem() {
      if(!patternSets[level]) patternSets[level]=makeQuestionSet(level);
      answer = [...patternSets[level][problemIndex]];
      feedback.textContent = "";
      levelTitle.textContent = configs[level].title;
      progress.textContent = `${problemIndex+1}/3 문제`;
      instruction.textContent = configs[level].guide;
      buildLegend();
      renderBoard(answer);
      awaitingNext = false;
      checkBtn.textContent = "완성했어요";
      checkBtn.disabled = false;
    }

    function completeArrangement() {
      awaitingNext = true;
      feedback.textContent = "정답이에요! 종이컵을 화면과 똑같이 잘 놓았어요.";
      board.querySelectorAll(".cell").forEach(cell => cell.classList.add("good"));
      checkBtn.textContent = problemIndex < 2 ? "다음 문제" : "다음 단계";
    }

    function nextProblem() {
      if(problemIndex<2) { problemIndex+=1; startProblem(); return; }
      completedLevels.add(level);
      if(completedLevels.size===3) { finishGame(); return; }
      const next = level<3 ? level+1 : [1,2,3].find(value=>!completedLevels.has(value));
      overlayHero.textContent = "✨";
      overlayTitle.textContent = `난이도 ${level} 완료!`;
      overlayText.innerHTML = `10개 중 무작위 종이컵 배치 3개를 모두 완성했어요.<br>다음에는 새로운 색 컵이 추가돼요.`;
      overlayBtn.textContent = `난이도 ${next} 시작`;
      overlayBtn.onclick = () => { overlay.classList.add("hide"); selectLevel(next); };
      overlay.classList.remove("hide");
    }

    function selectLevel(nextLevel) {
      level = Number(nextLevel);
      problemIndex = 0;
      tabs.forEach(tab => tab.classList.toggle("active",Number(tab.dataset.level)===level));
      startProblem();
    }

    function finishGame() {
      try { if(window.parent&&window.parent!==window&&typeof window.parent.completeChallengeStep==="function") window.parent.completeChallengeStep(6); } catch(error) {}
      overlayHero.textContent = "🎉";
      overlayTitle.textContent = "종이컵 위치 미션 완료!";
      overlayText.innerHTML = "빈자리와 빨간 컵, 파란 컵의 위치를<br>화면과 똑같이 모두 완성했어요.";
      rewardBtn.classList.add("show");
      overlayBtn.textContent = "챌린지로 돌아가기";
      overlayBtn.onclick = exitToChallenge;
      overlay.classList.remove("hide");
    }

    function claimReward() {
      if(pointClaimed) return;
      pointClaimed=true;
      try { if(window.parent&&window.parent!==window&&typeof window.parent.claimChallengeStepReward==="function") window.parent.claimChallengeStepReward(6); } catch(error) {}
      rewardBtn.textContent="200P 받았어요";
      rewardBtn.disabled=true;
    }

    function startGame() {
      patternSets={1:makeQuestionSet(1),2:makeQuestionSet(2),3:makeQuestionSet(3)};
      completedLevels=new Set();
      overlay.classList.add("hide");
      selectLevel(1);
    }

    function exitToChallenge() {
      try { if(window.parent&&window.parent!==window&&typeof window.parent.prevPage==="function") { window.parent.prevPage(11); return; } } catch(error) {}
      window.history.back();
    }

    checkBtn.addEventListener("click",()=> awaitingNext ? nextProblem() : completeArrangement());
    tabs.forEach(tab=>tab.addEventListener("click",()=>selectLevel(tab.dataset.level)));
    overlayBtn.addEventListener("click",startGame);
    rewardBtn.addEventListener("click",claimReward);
    buildLegend();
    renderBoard(Array(9).fill(""));
  </script>
<script src="challenge-common.js?v=20260811-common2" data-step="6"></script>
</body>
</html>
