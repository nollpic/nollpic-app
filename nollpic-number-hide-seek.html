<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>숫자 숨바꼭질</title><style>
:root{--navy:#0e1d3e;--orange:#ff6818;--green:#20a56b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--navy);background:#e2e8f0}button{font:inherit}.app{position:relative;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(255,248,248,.98),rgba(255,255,255,.94) 62%,#f5fbff),radial-gradient(circle at 10% 10%,rgba(255,107,0,.08),transparent 28%)}header{height:78px;padding:15px 18px 8px;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:0;border-radius:15px;background:#fff0e8;color:var(--orange);font-size:28px;font-weight:950}.heading{flex:1}.heading small{color:var(--orange);font-size:11px;font-weight:900}.heading h1{margin:2px 0 0;font-size:21px}.badge{padding:8px 9px;border:1px solid #ffb78c;border-radius:99px;background:#fff8f3;color:#ed6413;font-size:10px;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 18px 9px;padding:6px;border-radius:18px;background:#fff;box-shadow:0 8px 20px #0e1d3e0c}.tab{height:40px;border:0;border-radius:13px;background:#f0f3f7;color:#7c8595;font-size:13px;font-weight:900}.tab.active{background:var(--orange);color:#fff;box-shadow:0 5px 12px #ff681844}.mission{margin:0 18px 9px;padding:10px 14px;border:2px solid #edf0f4;border-radius:19px;background:#fff;display:flex;align-items:center;justify-content:space-between}.mission strong{color:var(--orange);font-size:13px}.mission span{color:#677286;font-size:12px;font-weight:900}
.play{flex:1;min-height:0;margin:0 18px 12px;padding:12px;border-radius:28px;background:#ffffffed;display:flex;flex-direction:column;box-shadow:0 14px 32px #1c395818}.target{height:78px;border-radius:21px;background:linear-gradient(135deg,#fff0e7,#fff9d9);display:flex;align-items:center;justify-content:center;gap:14px;color:#58657a;font-size:13px;font-weight:900}.target b{display:grid;place-items:center;min-width:58px;height:58px;padding:0 8px;border-radius:18px;background:var(--orange);color:#fff;font-size:35px;font-weight:950;box-shadow:0 6px 0 #d7520d}.live-timer{height:42px;margin:8px auto 0;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:15px;background:#142443;color:#fff;box-shadow:0 5px 0 #09152e,0 8px 15px #0e1d3e22;font-variant-numeric:tabular-nums}.live-timer span{font-size:17px;animation:timerPulse .7s ease-in-out infinite}.live-timer b{min-width:63px;text-align:right;color:#ffcf55;font-size:23px;font-weight:950;letter-spacing:.5px}.live-timer em{font-style:normal;font-size:12px;font-weight:900;color:#cbd5e1}.search-area{position:relative;flex:1;min-height:0;margin-top:10px;padding:12px;border-radius:24px;background:linear-gradient(145deg,#f8fbff,#fff8f2);border:2px solid #fff;box-shadow:inset 0 0 0 1px #dfe8f2;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:5px;overflow:hidden}.search-area.dense{grid-template-columns:repeat(5,1fr)}.number{position:relative;border:0;background:transparent;color:var(--color);font-size:var(--size);font-weight:var(--weight);transform:rotate(var(--rotate));border-radius:15px;line-height:1;transition:.12s}.number:active{background:#fff0e8;transform:rotate(var(--rotate)) scale(.88)}.number.wrong{animation:shake .32s ease;color:#e6424e}.number.found{background:#e7fff1;color:var(--green);box-shadow:0 0 0 3px #a9e8c6;animation:pop .35s ease}.hint{height:27px;margin-top:5px;text-align:center;color:#748197;font-size:11px;font-weight:850}.answer-pop{position:absolute;z-index:10;left:50%;top:53%;transform:translate(-50%,-50%);padding:21px 26px;border-radius:27px;background:#fff;color:var(--green);font-size:25px;font-weight:950;text-align:center;box-shadow:0 22px 60px #0e1d3e44;opacity:0;pointer-events:none}.answer-pop.show{animation:answerPop .9s ease both}.answer-pop small{display:block;margin-top:5px;color:#657085;font-size:12px}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:#0e1d3e5e;backdrop-filter:blur(5px)}.overlay.hide{display:none}.panel{width:min(100%,340px);padding:27px 22px 22px;border-radius:28px;background:#fff;text-align:center;box-shadow:0 24px 60px #0e1d3e35}.hero{font-size:54px}.panel h2{margin:8px 0;font-size:23px}.panel p{margin:0 0 20px;color:#657188;font-size:14px;line-height:1.6;font-weight:750}.panel button{width:100%;height:52px;border:0;border-radius:18px;background:var(--orange);color:#fff;font-weight:950;box-shadow:0 5px 0 #d7520d}.reward{display:none!important;margin-bottom:10px;background:#fff1bd!important;color:#996000!important;box-shadow:none!important}.reward.show{display:block!important}@keyframes timerPulse{50%{transform:scale(1.17);opacity:.65}}@keyframes shake{25%{transform:translateX(-5px) rotate(var(--rotate))}75%{transform:translateX(5px) rotate(var(--rotate))}}@keyframes pop{50%{transform:scale(1.15)}}@keyframes answerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-57%) scale(.9)}}@media(max-height:720px){header{height:66px;padding-top:8px}.tabs,.mission{margin-bottom:6px}.mission{padding:8px 12px}.play{padding:9px}.target{height:62px}.target b{height:48px;min-width:50px;font-size:29px}.live-timer{height:34px;margin-top:5px}.live-timer b{font-size:19px}.search-area{margin-top:7px;padding:8px}.hint{height:20px}}
</style></head><body><main class="app"><header><button class="back" onclick="exitToChallenge()">‹</button><div class="heading"><small>오늘의 미션</small><h1>숫자 숨바꼭질</h1></div><span class="badge">시각탐색 · 집중</span></header><nav class="tabs"><button class="tab active" data-level="1">난이도 1</button><button class="tab" data-level="2">난이도 2</button><button class="tab" data-level="3">난이도 3</button></nav><section class="mission"><strong id="levelTitle">숫자 16개</strong><span id="progress">1/3 문제</span></section><section class="play"><div class="target"><span>아래에서 이 숫자를 찾아요!</span><b id="target">19</b></div><div class="live-timer"><span>⏱</span><b id="liveTimer">0.00</b><em>초</em></div><div class="search-area" id="searchArea"></div><div class="hint" id="hint">숫자를 빠르게 톡 눌러보세요.</div></section><div class="answer-pop" id="answerPop">🎉 찾았어요!<small id="timeText"></small></div><section class="overlay" id="overlay"><div class="panel"><div class="hero" id="overlayHero">🔍</div><h2 id="overlayTitle">꼭꼭 숨은 숫자를 찾아요!</h2><p id="overlayText">위에 나온 목표 숫자를 기억하고<br>많은 숫자 속에서 빠르게 찾아 눌러보세요.</p><button class="reward" id="rewardBtn">🎁 200P 받기</button><button id="overlayBtn">놀이 시작</button></div></section></main><script>
const configs={1:{count:16,max:25,title:"숫자 16개"},2:{count:22,max:50,title:"숫자 22개"},3:{count:28,max:99,title:"숫자 28개"}},targetPools={1:[3,6,8,11,14,17,19,20,22,24],2:[12,16,19,23,28,31,37,42,46,49],3:[16,19,28,37,46,58,61,67,82,93]};const searchArea=document.getElementById("searchArea"),targetEl=document.getElementById("target"),levelTitle=document.getElementById("levelTitle"),progress=document.getElementById("progress"),hint=document.getElementById("hint"),liveTimer=document.getElementById("liveTimer"),answerPop=document.getElementById("answerPop"),timeText=document.getElementById("timeText"),overlay=document.getElementById("overlay"),overlayHero=document.getElementById("overlayHero"),overlayTitle=document.getElementById("overlayTitle"),overlayText=document.getElementById("overlayText"),overlayBtn=document.getElementById("overlayBtn"),rewardBtn=document.getElementById("rewardBtn"),tabs=[...document.querySelectorAll(".tab")];let level=1,index=0,targets={},target=19,startedAt=0,locked=false,completed=new Set(),pointClaimed=false,advanceTimer=0,timerInterval=0;
const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function chooseTargets(l){return shuffle(targetPools[l]).slice(0,5)}function makeNumbers(){const cfg=configs[level],set=new Set([target]);while(set.size<cfg.count)set.add(1+Math.floor(Math.random()*cfg.max));return shuffle([...set])}function styleFor(i){const colors=["#15223d","#e84e42","#2475b8","#7b4ca5","#e68a12","#22935e"],sizes=level===1?[22,26,30]:level===2?[19,23,27,31]:[17,20,24,28,32];return `--color:${colors[i%colors.length]};--size:${sizes[(i*3+index)%sizes.length]}px;--weight:${i%3===0?950:i%3===1?750:500};--rotate:${[-12,-7,-3,0,4,8,12][(i*5+index)%7]}deg`}
function stopLiveTimer(){window.clearInterval(timerInterval);timerInterval=0}function startLiveTimer(){stopLiveTimer();liveTimer.textContent="0.00";timerInterval=window.setInterval(()=>{liveTimer.textContent=((Date.now()-startedAt)/1000).toFixed(2)},30)}function showProblem(){window.clearTimeout(advanceTimer);target=targets[level][index];targetEl.textContent=target;levelTitle.textContent=configs[level].title;progress.textContent=`${index+1}/5 문제`;hint.textContent="숫자를 빠르게 톡 눌러보세요.";searchArea.classList.toggle("dense",configs[level].count>16);searchArea.innerHTML=makeNumbers().map((n,i)=>`<button class="number" data-value="${n}" style="${styleFor(i)}" aria-label="숫자 ${n}">${n}</button>`).join("");searchArea.querySelectorAll(".number").forEach(b=>b.addEventListener("click",()=>pick(b)));locked=false;startedAt=Date.now();startLiveTimer();tabs.forEach(t=>t.classList.toggle("active",Number(t.dataset.level)===level))}function pick(button){if(locked)return;if(Number(button.dataset.value)!==target){button.classList.remove("wrong");void button.offsetWidth;button.classList.add("wrong");hint.textContent="앗, 다른 숫자예요. 다시 찾아보세요!";return}locked=true;stopLiveTimer();const seconds=((Date.now()-startedAt)/1000).toFixed(2);liveTimer.textContent=seconds;button.classList.add("found");timeText.textContent=`${seconds}초 만에 찾았어요`;answerPop.classList.remove("show");void answerPop.offsetWidth;answerPop.classList.add("show");advanceTimer=window.setTimeout(next,900)}function next(){if(index<4){index++;showProblem();return}completed.add(level);if(completed.size===3){finish();return}const nextLevel=[1,2,3].find(n=>!completed.has(n));overlayHero.textContent="⚡";overlayTitle.textContent=`난이도 ${level} 완료!`;overlayText.innerHTML="숨은 숫자 5개를 모두 찾았어요.<br>이번에는 숫자가 더 많아져요!";overlayBtn.textContent=`난이도 ${nextLevel} 시작`;overlayBtn.onclick=()=>{overlay.classList.add("hide");selectLevel(nextLevel)};overlay.classList.remove("hide")}function selectLevel(l){level=Number(l);index=0;if(!targets[level])targets[level]=chooseTargets(level);showProblem()}function start(){targets={1:chooseTargets(1),2:chooseTargets(2),3:chooseTargets(3)};completed=new Set();overlay.classList.add("hide");selectLevel(1)}function finish(){stopLiveTimer();try{if(parent&&parent!==window&&typeof parent.completeChallengeStep==="function")parent.completeChallengeStep(11)}catch(e){}overlayHero.textContent="🎉";overlayTitle.textContent="숫자 숨바꼭질 완료!";overlayText.innerHTML="많은 숫자 속에서도 목표 숫자를<br>빠르고 정확하게 모두 찾았어요.";rewardBtn.classList.add("show");overlayBtn.textContent="챌린지로 돌아가기";overlayBtn.onclick=exitToChallenge;overlay.classList.remove("hide")}function claimReward(){if(pointClaimed)return;pointClaimed=true;try{if(parent&&parent!==window&&typeof parent.claimChallengeStepReward==="function")parent.claimChallengeStepReward(11)}catch(e){}rewardBtn.textContent="200P 받았어요";rewardBtn.disabled=true}function exitToChallenge(){stopLiveTimer();try{if(parent&&parent!==window&&typeof parent.prevPage==="function"){parent.prevPage(11);return}}catch(e){}history.back()}tabs.forEach(t=>t.addEventListener("click",()=>selectLevel(t.dataset.level)));overlayBtn.onclick=start;rewardBtn.addEventListener("click",claimReward);
</script><script src="challenge-common.js?v=20260811-common2" data-step="11"></script></body></html>
