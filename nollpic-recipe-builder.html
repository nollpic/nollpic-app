<style>
:root{--navy:#102044;--orange:#ff6818;--green:#1da56b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--navy);background:#edf3f9}button{font:inherit}.app{position:relative;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff8f5,#edf8ff)}header{height:77px;padding:14px 18px 8px;display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border:0;border-radius:15px;background:#fff0e8;color:var(--orange);font-size:28px;font-weight:950}.heading{flex:1}.heading small{color:var(--orange);font-size:11px;font-weight:900}.heading h1{margin:2px 0 0;font-size:20px}.badge{padding:8px;border:1px solid #ffb78c;border-radius:99px;background:#fff8f3;color:#ed6413;font-size:10px;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 18px 8px;padding:6px;border-radius:18px;background:#fff}.tab{height:40px;border:0;border-radius:13px;background:#f0f3f7;color:#7c8595;font-size:13px;font-weight:900}.tab.active{background:var(--orange);color:#fff;box-shadow:0 5px 12px #ff681844}.mission{margin:0 18px 8px;padding:10px 14px;border:2px solid #edf0f4;border-radius:19px;background:#fff;display:flex;justify-content:space-between}.mission strong{color:var(--orange);font-size:13px}.mission span{color:#677286;font-size:12px;font-weight:900}.play{flex:1;min-height:0;margin:0 18px 12px;padding:12px;border-radius:28px;background:#fff;overflow-y:auto;box-shadow:0 14px 32px #1c395818}.section-title{text-align:center;color:#52627c;font-size:12px;font-weight:950}.reference{min-height:145px;margin-top:7px;padding:12px 8px;border:2px solid #ffe1b4;border-radius:22px;background:linear-gradient(135deg,#fff1df,#fffbe9);display:flex;align-items:center;justify-content:center;gap:16px}.dish-card{text-align:center}.dish-card small{display:block;margin-top:6px;color:#263756;font-size:11px;font-weight:950}.plate{position:relative;width:94px;height:94px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #d8e1ea,0 0 0 8px #fff,0 7px 15px #13254a28}.roll{position:absolute;inset:13%;border-radius:50%;background:#202735;box-shadow:inset 0 0 0 3px #0e1420}.rice-ring{position:absolute;inset:20%;border-radius:50%;background:#fffdf0;box-shadow:inset 0 0 0 2px #e3dfcc}.piece{position:absolute;left:50%;top:50%;width:27%;height:27%;transform:translate(-50%,-50%) rotate(var(--turn));border-radius:var(--shape);background:var(--color);border:2px solid #fff;box-shadow:0 1px 3px #0004}.piece:nth-child(3){transform:translate(-88%,-25%) rotate(var(--turn))}.piece:nth-child(4){transform:translate(-15%,-78%) rotate(var(--turn))}.piece:nth-child(5){transform:translate(-10%,8%) rotate(var(--turn))}.build-zone{display:flex;justify-content:center;gap:16px;margin:11px 0}.build-dish{position:relative;border:0;padding:0;border-radius:50%;background:transparent}.build-dish .plate{width:98px;height:98px;background:#f9fbfd}.build-dish.empty .plate::after{content:"재료 놓기";position:absolute;inset:30%;display:grid;place-items:center;border:2px dashed #a8b8ca;border-radius:50%;color:#7b899d;font-size:9px;font-weight:900}.build-dish::after{content:attr(data-count);position:absolute;right:-5px;top:-5px;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#17315d;color:#fff;font-size:10px;font-weight:950}.build-dish.correct .plate{animation:pop .35s;box-shadow:0 0 0 5px #65cf99,0 0 0 8px #fff,0 7px 15px #13254a28}.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:7px;padding:9px;border-radius:20px;background:#edf4fb}.ingredient{position:relative;min-width:0;aspect-ratio:1;border:2px solid #fff;border-radius:17px;background:#fff;box-shadow:0 5px 0 #dbe3eb}.ingredient i{position:absolute;left:50%;top:42%;width:52%;height:52%;transform:translate(-50%,-50%);border-radius:var(--shape);background:var(--color);border:2px solid #eef2f7}.ingredient span{position:absolute;left:2px;right:2px;bottom:3px;color:#3f4f69;font-size:9px;font-weight:950}.ingredient.selected{box-shadow:0 0 0 3px var(--orange),0 5px 0 #e8b08d}.ingredient.used{opacity:.18;pointer-events:none}.ingredient.wrong{animation:shake .3s}.feedback{min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;color:#52627c;font-size:11px;font-weight:900}.answer-pop{position:absolute;z-index:15;left:50%;top:52%;transform:translate(-50%,-50%);padding:22px 27px;border-radius:27px;background:#fff;color:var(--green);font-size:25px;font-weight:950;box-shadow:0 22px 60px #0e1d3e44;opacity:0;pointer-events:none}.answer-pop.show{animation:answerPop .9s ease both}.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:#0e1d3e5e;backdrop-filter:blur(5px)}.overlay.hide{display:none}.panel{width:min(100%,340px);padding:27px 22px 22px;border-radius:28px;background:#fff;text-align:center}.hero{font-size:54px}.panel h2{margin:8px 0;font-size:23px}.panel p{margin:0 0 20px;color:#657188;font-size:14px;line-height:1.6;font-weight:750}.panel button{width:100%;height:52px;border:0;border-radius:18px;background:var(--orange);color:#fff;font-weight:950;box-shadow:0 5px 0 #d7520d}.reward{display:none!important;margin-bottom:10px;background:#fff1bd!important;color:#996000!important;box-shadow:none!important}.reward.show{display:block!important}@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes answerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-57%) scale(.9)}}
.section-title{color:#34425b;font-size:13px}.reference{min-height:132px;padding:10px 8px;border:1px solid #ffd49a;background:#fff8e9;gap:18px}.plate{width:92px;height:92px;box-shadow:0 0 0 3px #dbe4ec,0 5px 11px #13254a20}.plate .roll{inset:15%;box-shadow:none}.plate.v1 .roll{background:#f18caf;box-shadow:none}.plate.v2 .roll{background:#f0a229;box-shadow:none}.plate.v3 .roll{background:#72c267;box-shadow:none}.plate .rice-ring{inset:21%;box-shadow:none}.filling{position:absolute;inset:31%;border-radius:50%;background:var(--segments);border:1px solid #25344d;box-shadow:none}.build-dish .plate{width:96px;height:96px;background:#fff}.build-dish.empty .plate::after{content:"";position:absolute;inset:29%;display:block;border:3px solid #ef4058;border-radius:50%;background:#fff;color:transparent}.ingredient{touch-action:none;cursor:grab}.ingredient:active{cursor:grabbing}.drag-ghost{position:fixed;z-index:100;width:62px;height:62px;border-radius:18px;background:#fff;box-shadow:0 12px 28px #10204455;pointer-events:none;transform:translate(-50%,-50%)}.drag-ghost::after{content:"";position:absolute;inset:13px;border-radius:var(--shape);background:var(--color)}
@media(max-width:370px){.reference,.build-zone{gap:10px}.plate{width:82px;height:82px}.build-dish .plate{width:86px;height:86px}.tray{gap:5px;padding:7px}}@media(max-height:720px){header{height:65px;padding-top:8px}.tabs,.mission{margin-bottom:6px}.mission{padding:8px 12px}.play{padding:8px}.reference{min-height:112px;padding:7px}.plate{width:74px;height:74px}.build-dish .plate{width:78px;height:78px}.feedback{min-height:22px}}
</style></head><body><main class="app">
<header><button class="back" onclick="exitToChallenge()">‹</button><div class="heading"><small>오늘의 미션</small><h1>그림 보고 재료 조립하기</h1></div><span class="badge">구성력 · 시각탐색</span></header>
<nav class="tabs"><button class="tab active" data-level="1">난이도 1</button><button class="tab" data-level="2">난이도 2</button><button class="tab" data-level="3">난이도 3</button></nav>
<section class="mission"><strong id="levelTitle">재료 2개 조립</strong><span id="progress">1/3 문제</span></section>
<section class="play"><div class="section-title">드래그해서 위의 모양으로 완성하세요!</div><div class="reference" id="reference"></div><div class="build-zone" id="buildZone"></div><div class="tray" id="tray"></div><div class="feedback" id="feedback" style="display:none"></div></section>
<div class="answer-pop" id="answerPop">🎉 정답!</div><section class="overlay" id="overlay"><div class="panel"><div class="hero" id="overlayHero">🍣</div><h2 id="overlayTitle">그림처럼 만들어봐요!</h2><p id="overlayText">완성 그림의 색과 모양을 자세히 보고<br>같은 번호의 접시에 재료를 놓아주세요.</p><button class="reward" id="rewardBtn">🎁 200P 받기</button><button id="overlayBtn">놀이 시작</button></div></section>
</main><script>
const materials={salmon:{name:"연어",color:"#ef5167",shape:"50%"},egg:{name:"달걀",color:"#f6c72c",shape:"50%"},cucumber:{name:"오이",color:"#4fba55",shape:"30%"},tuna:{name:"참치",color:"#d83b48",shape:"24%"},cheese:{name:"치즈",color:"#f08b31",shape:"20%"},purple:{name:"자색",color:"#8d51a7",shape:"50%"},blue:{name:"파랑",color:"#3981ce",shape:"30%"}};
const fillings=Object.keys(materials),titles={1:"재료 2개 조립",2:"재료 3개 조립",3:"재료 3개와 방해 조각"};
const patterns=[["purple"],["salmon","cucumber"],["egg"],["blue","egg"],["cucumber","cheese"],["tuna","purple"],["salmon","egg","cucumber"],["blue","cheese","purple"],["tuna","egg","cucumber"]];
const $=id=>document.getElementById(id),reference=$("reference"),buildZone=$("buildZone"),tray=$("tray"),feedback=$("feedback"),answerPop=$("answerPop"),levelTitle=$("levelTitle"),progress=$("progress"),overlay=$("overlay"),overlayHero=$("overlayHero"),overlayTitle=$("overlayTitle"),overlayText=$("overlayText"),overlayBtn=$("overlayBtn"),rewardBtn=$("rewardBtn"),tabs=[...document.querySelectorAll(".tab")];
let level=1,problemIndex=0,problems={},problem,built,tokens,selectedToken=null,dragState=null,completed=new Set(),pointClaimed=false,advanceTimer=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function makeProblem(l,i){const count=l===1?2:3,start=(i*3+l-1)%patterns.length,dishes=[];for(let n=0;n<count;n++){let recipe=patterns[(start+n)%patterns.length];if(l===1)recipe=recipe.slice(0,Math.min(2,recipe.length));dishes.push([...recipe])}const used=dishes.flat(),extra=l===3?shuffle(fillings).slice(0,6):l===2?shuffle(fillings).slice(0,2):[];return{dishes,tokenMaterials:shuffle([...used,...extra])}}
function makeThree(l){return[0,1,2].map(i=>makeProblem(l,i))}
function segmentGradient(recipe){if(!recipe.length)return "#f9fbfd";const step=100/recipe.length;return `conic-gradient(${recipe.map((id,i)=>`${materials[id].color} ${i*step}% ${(i+1)*step}%`).join(",")})`}
function plateHtml(recipe,variant){return `<div class="plate v${variant%4}"><div class="roll"></div><div class="rice-ring"></div>${recipe.length?`<i class="filling" style="--segments:${segmentGradient(recipe)}"></i>`:""}</div>`}
function renderReference(){reference.innerHTML=problem.dishes.map((r,i)=>`<div class="dish-card">${plateHtml(r,problemIndex+i)}<small>${i+1}번 완성 그림</small></div>`).join("")}
function renderBuild(){buildZone.innerHTML=problem.dishes.map((r,i)=>`<button class="build-dish ${built[i].length?'':'empty'}" data-dish="${i}" data-count="${i+1}번 · ${built[i].length}/${r.length}">${plateHtml(built[i],problemIndex+i)}</button>`).join("");buildZone.querySelectorAll(".build-dish").forEach(b=>b.onclick=()=>selectedToken&&placeToken(+b.dataset.dish,selectedToken))}
function renderTray(){tray.innerHTML=tokens.map(t=>{const m=materials[t.material];return `<button class="ingredient ${t.used?'used':''}" data-token="${t.id}" style="--color:${m.color};--shape:${m.shape}"><i></i><span>${m.name}</span></button>`}).join("");tray.querySelectorAll(".ingredient:not(.used)").forEach(b=>b.addEventListener("pointerdown",startDrag))}
function startDrag(e){const token=tokens.find(t=>t.id===e.currentTarget.dataset.token&&!t.used);if(!token)return;e.preventDefault();const m=materials[token.material],ghost=document.createElement("div");ghost.className="drag-ghost";ghost.style.setProperty("--color",m.color);ghost.style.setProperty("--shape",m.shape);document.body.appendChild(ghost);moveGhost(ghost,e);dragState={token,ghost,button:e.currentTarget};e.currentTarget.setPointerCapture?.(e.pointerId);e.currentTarget.addEventListener("pointermove",dragMove);e.currentTarget.addEventListener("pointerup",dragEnd,{once:true});e.currentTarget.addEventListener("pointercancel",dragEnd,{once:true})}
function moveGhost(ghost,e){ghost.style.left=`${e.clientX}px`;ghost.style.top=`${e.clientY}px`}
function dragMove(e){if(dragState)moveGhost(dragState.ghost,e)}
function dragEnd(e){if(!dragState)return;const state=dragState;dragState=null;state.ghost.remove();state.button.removeEventListener("pointermove",dragMove);const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".build-dish");if(target)placeToken(+target.dataset.dish,state.token)}
function selectToken(id){selectedToken=tokens.find(t=>t.id===id&&!t.used)||null;renderTray();feedback.textContent=selectedToken?`${materials[selectedToken.material].name}을 어느 접시에 놓을까요?`:"필요한 재료를 골라보세요."}
function placeToken(i,t){const expected=problem.dishes[i][built[i].length];if(!expected){feedback.textContent="이 접시는 이미 완성됐어요.";return}if(t.material!==expected){feedback.textContent=`${i+1}번 그림의 색과 모양을 다시 살펴보세요.`;const el=tray.querySelector(`[data-token="${t.id}"]`);el?.classList.add("wrong");setTimeout(()=>el?.classList.remove("wrong"),350);return}t.used=true;built[i].push(t.material);selectedToken=null;feedback.textContent=`${i+1}번 접시에 ${materials[t.material].name}을 놓았어요!`;renderBuild();renderTray();if(built.every((r,n)=>r.length===problem.dishes[n].length))completeProblem()}
function completeProblem(){answerPop.classList.remove("show");void answerPop.offsetWidth;answerPop.classList.add("show");advanceTimer=setTimeout(nextProblem,950)}
function nextProblem(){if(problemIndex<2){problemIndex++;startProblem();return}completed.add(level);if(completed.size===3){finishGame();return}const next=[1,2,3].find(n=>!completed.has(n));overlayHero.textContent="🍣";overlayTitle.textContent=`난이도 ${level} 완료!`;overlayText.innerHTML="서로 다른 완성 그림 3문제를 모두 만들었어요.<br>다음에는 재료가 더 많아져요!";overlayBtn.textContent=`난이도 ${next} 시작`;overlayBtn.onclick=()=>{overlay.classList.add("hide");selectLevel(next)};overlay.classList.remove("hide")}
function startProblem(){clearTimeout(advanceTimer);problem=problems[level][problemIndex];built=problem.dishes.map(()=>[]);tokens=problem.tokenMaterials.map((material,i)=>({id:`${level}-${problemIndex}-${i}`,material,used:false}));selectedToken=null;levelTitle.textContent=titles[level];progress.textContent=`${problemIndex+1}/3 문제`;feedback.textContent="필요한 재료부터 찾아보세요.";renderReference();renderBuild();renderTray();tabs.forEach(t=>t.classList.toggle("active",+t.dataset.level===level))}
function selectLevel(l){level=+l;problemIndex=0;if(!problems[level])problems[level]=makeThree(level);startProblem()}
function startGame(){problems={1:makeThree(1),2:makeThree(2),3:makeThree(3)};completed=new Set();overlay.classList.add("hide");selectLevel(1)}
function finishGame(){try{parent!==window&&parent.completeChallengeStep?.(13)}catch(e){}overlayHero.textContent="🎉";overlayTitle.textContent="재료 조립 완료!";overlayText.innerHTML="완성 그림의 색과 모양을 구별해서<br>모든 접시를 똑같이 완성했어요.";rewardBtn.classList.add("show");overlayBtn.textContent="챌린지로 돌아가기";overlayBtn.onclick=exitToChallenge;overlay.classList.remove("hide")}
function claimReward(){if(pointClaimed)return;pointClaimed=true;try{parent!==window&&parent.claimChallengeStepReward?.(13)}catch(e){}rewardBtn.textContent="200P 받았어요";rewardBtn.disabled=true}
function exitToChallenge(){try{if(parent!==window&&typeof parent.prevPage==="function"){parent.prevPage(11);return}}catch(e){}history.back()}
tabs.forEach(t=>t.onclick=()=>selectLevel(t.dataset.level));overlayBtn.onclick=startGame;rewardBtn.onclick=claimReward;
</script><script src="challenge-common.js?v=20260811-common2" data-step="13"></script></body></html>
