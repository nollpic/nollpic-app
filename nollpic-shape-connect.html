<header><button class="back" onclick="exitToChallenge()">‹</button><div class="heading"><small>오늘의 미션</small><h1>같은 모양 길 잇기</h1></div><span class="badge">계획력 · 집중</span></header>
<nav class="tabs"><button class="tab active" data-level="1">난이도 1</button><button class="tab" data-level="2">난이도 2</button><button class="tab" data-level="3">난이도 3</button><button class="tab" data-level="4">난이도 4</button></nav>
<section class="mission"><strong id="levelTitle">6×6 · 모양 3쌍</strong><span id="progress">1/3 문제</span></section>
<section class="play"><p class="guide">같은 모양끼리 겹치지 않게 연결하세요!</p><div class="board-wrap" id="board"><div class="grid" id="grid"></div><svg id="lines"></svg></div><div class="hint" id="hint">모양에서 손가락을 움직여 선을 그려요.</div><button class="reset" id="resetBtn">다시 그리기</button></section>
<div class="answer-pop" id="answerPop">🎉 완성!</div><section class="overlay" id="overlay"><div class="panel"><div class="hero" id="overlayHero">🧠</div><h2 id="overlayTitle">같은 모양을 연결해요!</h2><p id="overlayText">같은 모양끼리 상하좌우로 연결하세요.<br>선은 서로 겹칠 수 없어요.</p><button class="reward" id="rewardBtn">🎁 200P 받기</button><button id="overlayBtn">놀이 시작</button></div></section>
</main><script>
const configs={1:{n:6,pairs:3,questions:3,title:"6×6 · 모양 3쌍"},2:{n:7,pairs:4,questions:4,title:"7×7 · 모양 4쌍"},3:{n:8,pairs:6,questions:3,title:"8×8 · 모양 6쌍"},4:{n:8,pairs:6,questions:3,title:"8×8 · 화살표 규칙"}},symbols=["●","▲","■","◆","★","✚"],colors=["#ef4058","#347fd0","#29a35a","#8b4fb3","#f08a22","#08a6b8"];
const bases={1:[[[0,0],[0,4]],[[1,2],[4,5]],[[2,0],[5,3]]],2:[[[0,0],[0,5]],[[1,2],[5,6]],[[2,0],[6,3]],[[3,4],[6,5]]],3:[[[0,0],[0,6]],[[1,2],[6,7]],[[2,0],[7,3]],[[3,5],[7,6]],[[4,1],[5,4]]]},alts={1:[[[0,1],[3,5]],[[1,4],[5,4]],[[2,0],[5,2]]],2:[[[0,1],[4,6]],[[1,5],[6,5]],[[2,0],[6,2]],[[3,3],[5,4]]],3:[[[0,1],[5,7]],[[1,6],[7,5]],[[2,0],[7,2]],[[3,4],[6,6]],[[4,1],[5,3]]]};
const $=id=>document.getElementById(id),board=$("board"),grid=$("grid"),lines=$("lines"),hint=$("hint"),levelTitle=$("levelTitle"),progress=$("progress"),answerPop=$("answerPop"),overlay=$("overlay"),overlayHero=$("overlayHero"),overlayTitle=$("overlayTitle"),overlayText=$("overlayText"),overlayBtn=$("overlayBtn"),rewardBtn=$("rewardBtn"),resetBtn=$("resetBtn"),tabs=[...document.querySelectorAll(".tab")];
let level=1,index=0,sets={},problem=null,paths=[],active=null,completed=new Set(),pointClaimed=false,nextTimer=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function transform(point,n,mode){let[r,c]=point;if(mode&1)c=n-1-c;if(mode&2)r=n-1-r;if(mode&4)[r,c]=[c,r];return[r,c]}
function makeHardTen(){const n=8,out=[],ranges=[[[0,8],[9,16],[17,24],[25,32],[33,40],[41,63]],[[0,8],[9,18],[19,38],[39,45],[46,52],[53,63]],[[0,9],[10,17],[18,25],[26,44],[45,54],[55,63]],[[0,10],[11,23],[24,32],[33,41],[42,50],[51,63]],[[0,12],[13,21],[22,32],[33,43],[44,54],[55,63]]];let snake=[];for(let r=0;r<n;r++){const cols=[...Array(n).keys()];if(r%2)cols.reverse();cols.forEach(c=>snake.push([r,c]))}for(let k=0;k<10;k++){const order=shuffle([0,1,2,3,4,5]),mode=k%8,pairs=ranges[k%5].map(([s,e],i)=>({id:order[i],a:transform(snake[s],n,mode),b:transform(snake[e],n,mode)})).sort((a,b)=>a.id-b.id);out.push({n,pairs,obstacles:[]})}return shuffle(out).slice(0,configs[3].questions)}
function makeArrowTen(){const n=8,out=[],ranges=[[[0,8],[9,16],[17,24],[25,32],[33,40],[41,63]],[[0,8],[9,18],[19,38],[39,45],[46,52],[53,63]],[[0,9],[10,17],[18,25],[26,44],[45,54],[55,63]],[[0,10],[11,23],[24,32],[33,41],[42,50],[51,63]],[[0,12],[13,21],[22,32],[33,43],[44,54],[55,63]]],icons={"-1,0":"↑","1,0":"↓","0,-1":"←","0,1":"→"};let snake=[];for(let r=0;r<n;r++){const cols=[...Array(n).keys()];if(r%2)cols.reverse();cols.forEach(c=>snake.push([r,c]))}for(let k=0;k<10;k++){const order=shuffle([0,1,2,3,4,5]),mode=(k+2)%8,arrows=[];const pairs=ranges[k%5].map(([s,e],i)=>{const route=snake.slice(s,e+1).map(p=>transform(p,n,mode)),id=order[i];if(i!==1&&route.length>3){const at=Math.min(route.length-2,Math.max(1,Math.floor(route.length/2))),p=route[at],next=route[at+1],dr=next[0]-p[0],dc=next[1]-p[1];arrows.push({p,dr,dc,icon:icons[`${dr},${dc}`]})}return{id,a:route[0],b:route.at(-1)}}).sort((a,b)=>a.id-b.id);out.push({n,pairs,obstacles:[],arrows})}return shuffle(out).slice(0,configs[4].questions)}
function makeTen(l){if(l===3)return makeHardTen();if(l===4)return makeArrowTen();const n=configs[l].n,out=[];for(let k=0;k<10;k++){const source=k<8?bases[l]:alts[l],mode=k%8,pairs=source.map((pair,i)=>({id:i,a:transform(pair[0],n,mode),b:transform(pair[1],n,mode)}));out.push({n,pairs,obstacles:[]})}return shuffle(out).slice(0,configs[l].questions)}
const key=p=>`${p[0]}-${p[1]}`,same=(a,b)=>a[0]===b[0]&&a[1]===b[1],adjacent=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
function endpointAt(p){return problem.pairs.find(x=>same(x.a,p)||same(x.b,p))}
function isObstacle(p){return (problem.obstacles||[]).some(q=>same(q,p))}
function arrowAt(p){return (problem.arrows||[]).find(a=>same(a.p,p))}
function occupied(p,except){return paths.some((path,i)=>i!==except&&path.some(q=>same(q,p)))}
function render(){const n=problem.n;grid.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;grid.innerHTML="";for(let r=0;r<n;r++)for(let c=0;c<n;c++){const cell=document.createElement("div"),p=[r,c],pair=endpointAt(p),arrow=arrowAt(p);cell.className="cell";cell.dataset.r=r;cell.dataset.c=c;if(c===n-1)cell.style.borderRight="0";if(r===n-1)cell.style.borderBottom="0";if(isObstacle(p)){cell.classList.add("blocked");cell.innerHTML="<span>×</span>"}else if(pair){cell.classList.add("endpoint");cell.innerHTML=`<span class="symbol" style="--symbol:${colors[pair.id]}">${symbols[pair.id]}</span>`}else if(arrow){cell.classList.add("arrow-cell");cell.innerHTML=`<span class="arrow-mark">${arrow.icon}</span>`}grid.appendChild(cell)}lines.setAttribute("viewBox",`0 0 ${n} ${n}`);drawLines()}
function drawLines(){lines.innerHTML=paths.map((path,i)=>path.length>1?`<polyline points="${path.map(p=>`${p[1]+.5},${p[0]+.5}`).join(" ")}" fill="none" stroke="${colors[i]}" stroke-width=".22" stroke-linecap="round" stroke-linejoin="round"/>`:"").join("")}
function pointFromEvent(e){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell");return el&&board.contains(el)?[+el.dataset.r,+el.dataset.c]:null}
function startPath(e){const p=pointFromEvent(e),pair=p&&endpointAt(p);if(!pair)return;e.preventDefault();paths[pair.id]=[p];active=pair.id;board.setPointerCapture?.(e.pointerId);drawLines()}
function movePath(e){if(active===null)return;const p=pointFromEvent(e),path=paths[active];if(!p||isObstacle(p)||same(path.at(-1),p))return;if(path.length>1&&same(path.at(-2),p)){path.pop();drawLines();return}const last=path.at(-1),arrow=arrowAt(last);if(arrow&&(p[0]-last[0]!==arrow.dr||p[1]-last[1]!==arrow.dc)){hint.textContent=`화살표 ${arrow.icon} 방향으로 움직여요.`;return}if(!adjacent(last,p)||occupied(p,active)||path.some(q=>same(q,p)))return;const endpoint=endpointAt(p);if(endpoint&&endpoint.id!==active)return;path.push(p);drawLines()}
function allPairsConnected(){return paths.every((p,i)=>p.length>1&&((same(p[0],problem.pairs[i].a)&&same(p.at(-1),problem.pairs[i].b))||(same(p[0],problem.pairs[i].b)&&same(p.at(-1),problem.pairs[i].a))))}
function endPath(){if(active===null)return;const id=active,path=paths[id],pair=problem.pairs[id],last=path.at(-1),valid=(same(path[0],pair.a)&&same(last,pair.b))||(same(path[0],pair.b)&&same(last,pair.a));if(!valid)paths[id]=[];active=null;drawLines();if(allPairsConnected())completeProblem()}
function resetPaths(){paths=problem.pairs.map(()=>[]);active=null;drawLines();hint.textContent="모양에서 손가락을 움직여 선을 그려요."}
function completeProblem(){answerPop.classList.remove("show");void answerPop.offsetWidth;answerPop.classList.add("show");nextTimer=setTimeout(nextProblem,1000)}
function nextProblem(){if(index<sets[level].length-1){index++;startProblem();return}completed.add(level);if(level===4){finishGame();return}const next=level+1;overlayHero.textContent="✨";overlayTitle.textContent=`난이도 ${level} 완료!`;overlayText.innerHTML=`${sets[level].length}문제를 모두 연결했어요!`;overlayBtn.textContent=`난이도 ${next} 시작`;overlayBtn.onclick=()=>{overlay.classList.add("hide");selectLevel(next)};overlay.classList.remove("hide")}
function startProblem(){clearTimeout(nextTimer);problem=sets[level][index];paths=problem.pairs.map(()=>[]);levelTitle.textContent=configs[level].title;progress.textContent=`${index+1}/${sets[level].length} 문제`;hint.textContent=level===4?"화살표 칸에서는 화살표 방향으로 움직여요.":"모양에서 손가락을 움직여 선을 그려요.";tabs.forEach(t=>t.classList.toggle("active",+t.dataset.level===level));render()}
function selectLevel(l){level=+l;index=0;if(!sets[level])sets[level]=makeTen(level);startProblem()}
function startGame(){sets={1:makeTen(1),2:makeTen(2),3:makeTen(3),4:makeTen(4)};completed=new Set();overlay.classList.add("hide");selectLevel(1)}
function finishGame(){try{parent!==window&&parent.completeChallengeStep?.(14)}catch(e){}overlayHero.textContent="🎉";overlayTitle.textContent="길 잇기 완료!";overlayText.innerHTML="모든 모양을 겹치지 않게 연결했어요.";rewardBtn.classList.add("show");overlayBtn.textContent="챌린지로 돌아가기";overlayBtn.onclick=exitToChallenge;overlay.classList.remove("hide")}
function claimReward(){if(pointClaimed)return;pointClaimed=true;try{parent!==window&&parent.claimChallengeStepReward?.(14)}catch(e){}rewardBtn.textContent="200P 받았어요";rewardBtn.disabled=true}
function exitToChallenge(){try{if(parent!==window&&typeof parent.prevPage==="function"){parent.prevPage(11);return}}catch(e){}history.back()}
board.addEventListener("pointerdown",startPath);board.addEventListener("pointermove",movePath);board.addEventListener("pointerup",endPath);board.addEventListener("pointercancel",endPath);resetBtn.onclick=resetPaths;tabs.forEach(t=>t.onclick=()=>selectLevel(t.dataset.level));overlayBtn.onclick=startGame;rewardBtn.onclick=claimReward;
</script><script src="challenge-common.js?v=20260811-common2" data-step="14"></script></body></html>
