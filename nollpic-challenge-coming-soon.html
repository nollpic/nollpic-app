<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>놀픽 챌린지 준비 중</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Pretendard,"Malgun Gothic",sans-serif;color:#0e1d3e;background:#edf3f9}.app{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff8f5,#edf8ff)}header{height:78px;display:flex;align-items:center;gap:12px;padding:15px 18px}.back{width:42px;height:42px;border:0;border-radius:15px;background:#fff0e8;color:#ff6b16;font-size:29px;font-weight:900}.title small{color:#ff6b16;font-size:12px;font-weight:900}.title h1{margin:2px 0 0;font-size:21px}.content{flex:1;margin:0 18px 18px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;box-shadow:0 14px 32px #0e1d3e14}.hero{font-size:70px}.step{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:18px;background:#fff0e8;color:#ff6b16;font-size:25px;font-weight:950}.card h2{margin:15px 0 8px;font-size:24px}.card p{margin:0;color:#68758a;font-size:14px;line-height:1.6;font-weight:750}.card button{width:100%;height:52px;margin-top:24px;border:0;border-radius:18px;background:#ff6b16;color:#fff;font-weight:950;box-shadow:0 5px 0 #d9520b}
</style></head><body><main class="app"><header><button class="back" onclick="exitToChallenge()">‹</button><div class="title"><small>방학 챌린지</small><h1>새로운 놀이</h1></div></header><section class="content"><div class="card"><div class="hero">🧩</div><span class="step" id="step">10</span><h2 id="heading">놀이를 준비하고 있어요</h2><p id="message">이 번호의 놀이는 아직 연결되지 않았어요.<br>완성되면 바로 플레이할 수 있어요.</p><button onclick="exitToChallenge()">챌린지로 돌아가기</button></div></section></main><script>
const step=new URLSearchParams(location.search).get('step')||'10';document.getElementById('step').textContent=step;if(step==='11'){document.getElementById('heading').textContent='숫자 숨바꼭질 준비 중';document.getElementById('message').innerHTML='많은 숫자 속에서 목표 숫자를 찾는<br>11번 놀이를 준비하고 있어요.'}function exitToChallenge(){try{if(parent&&parent!==window&&typeof parent.prevPage==='function'){parent.prevPage(11);return}}catch(e){}history.back()}
</script></body></html>
