<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자플레이</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:'Pretendard',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:#fff8ec;color:#111827}
body{display:flex;flex-direction:column;min-height:100%;overflow:hidden}
.header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid rgba(17,24,39,.08)}
.back-btn{width:44px;height:44px;border:0;background:transparent;color:#111827;font-size:24px;font-weight:900;cursor:pointer}
.header-title{font-size:17px;font-weight:900}
.header-spacer{width:44px}
.stage{flex:1;display:flex;flex-direction:column;gap:18px;padding:24px 20px 26px;background:radial-gradient(circle at 50% 0,#fff4c7 0,#fff8ec 42%,#f5fbff 100%);overflow-y:auto}
.hero{width:min(100%,360px);margin:0 auto;display:grid;gap:16px}
.result-card{min-height:260px;border-radius:28px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:0 18px 36px rgba(102,70,20,.13);border:1px solid rgba(102,70,20,.06)}
.result-number{font-size:120px;line-height:1;font-weight:1000;color:#ff8a00;letter-spacing:-4px;font-variant-numeric:tabular-nums;text-shadow:0 8px 18px rgba(255,138,0,.18)}
.control-card{border-radius:24px;background:#fff;padding:18px;display:grid;gap:16px;box-shadow:0 10px 24px rgba(102,70,20,.09);border:1px solid rgba(102,70,20,.06)}
.field-label{font-size:14px;font-weight:900;color:#111827;display:flex;align-items:center;justify-content:space-between;gap:8px}
.number-control{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.step-btn{height:48px;border:0;border-radius:16px;background:#fff0c7;color:#a46300;font-size:26px;font-weight:1000;cursor:pointer}
.step-btn:active{transform:scale(.96)}
.max-input{width:100%;height:52px;border:2px solid #ffe1a0;border-radius:16px;text-align:center;font-size:24px;font-weight:1000;color:#111827;outline:none;background:#fffdf7}
.max-input:focus{border-color:#ffae2b;box-shadow:0 0 0 4px rgba(255,174,43,.16)}
.draw-btn{height:60px;border:0;border-radius:20px;background:#ff8a00;color:#fff;font-size:20px;font-weight:1000;cursor:pointer;box-shadow:0 14px 26px rgba(255,138,0,.28)}
.draw-btn:active{transform:scale(.97)}
.quick-row{display:flex;gap:8px;flex-wrap:wrap}
.quick-btn{border:0;border-radius:999px;padding:8px 12px;background:#f4f1f5;color:#4b5563;font-size:13px;font-weight:900;cursor:pointer}
.quick-btn:active{transform:scale(.96)}
@keyframes pop{0%{transform:scale(.82);opacity:.3}70%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
.result-number.pop{animation:pop .34s cubic-bezier(.2,1,.3,1)}
@media (max-height:620px){.result-card{min-height:210px}.result-number{font-size:78px}.stage{padding-top:16px;gap:12px}}
</style>
</head>
<body>
<header class="header">
  <button type="button" class="back-btn" aria-label="뒤로가기" onclick="goBack()">‹</button>
  <span class="header-title">숫자플레이</span>
  <div class="header-spacer"></div>
</header>
<main class="stage">
  <section class="hero" aria-label="숫자플레이">
    <div class="result-card">
      <div class="result-number" id="resultNumber">?</div>
    </div>
    <div class="control-card">
      <label class="field-label" for="maxInput">마지막 숫자</label>
      <div class="number-control">
        <button type="button" class="step-btn" onclick="changeMax(-1)">−</button>
        <input id="maxInput" class="max-input" type="number" min="1" max="9999" value="10" inputmode="numeric" oninput="syncMax()">
        <button type="button" class="step-btn" onclick="changeMax(1)">＋</button>
      </div>
      <div class="quick-row" aria-label="빠른 설정">
        <button type="button" class="quick-btn" onclick="setMax(10)">10</button>
        <button type="button" class="quick-btn" onclick="setMax(20)">20</button>
        <button type="button" class="quick-btn" onclick="setMax(50)">50</button>
        <button type="button" class="quick-btn" onclick="setMax(100)">100</button>
      </div>
      <button type="button" class="draw-btn" onclick="drawNumber()">숫자 뽑기</button>
    </div>
  </section>
</main>
<script>
const maxInput=document.getElementById('maxInput');
const resultNumber=document.getElementById('resultNumber');
let maxValue=10;
function clamp(value){return Math.min(9999,Math.max(1,Number(value)||1));}
function setMax(value){maxValue=clamp(value);maxInput.value=maxValue;}
function syncMax(){setMax(maxInput.value);}
function changeMax(delta){setMax(maxValue+delta);}
function drawNumber(){
  syncMax();
  const picked=Math.floor(Math.random()*maxValue)+1;
  resultNumber.textContent=picked.toLocaleString('ko-KR');
  resultNumber.classList.remove('pop');
  void resultNumber.offsetWidth;
  resultNumber.classList.add('pop');
}
function goBack(){if(window.parent) window.parent.postMessage({type:'exitPlay'},'*');}
</script>
</body>
</html>
