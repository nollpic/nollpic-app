<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:'Pretendard',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:#101820;color:#fff}
body{display:flex;flex-direction:column;min-height:100%;overflow:hidden}
.header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(0,0,0,.26);border-bottom:1px solid rgba(255,255,255,.08)}
.back-btn{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:24px;font-weight:900;cursor:pointer}
.header-title{font-size:17px;font-weight:900}
.header-spacer{width:44px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 20px 30px;background:radial-gradient(circle at 50% 18%,#1f3142 0,#111b24 48%,#0b1118 100%)}
.stopwatch-rig{width:min(100%,360px);display:grid;gap:24px;justify-items:center}
.display-stand{position:relative;width:100%;padding-top:18px}
.display{position:relative;width:100%;height:132px;border-radius:22px;background:#171b1d;border:5px solid #232a2c;display:flex;align-items:center;justify-content:center;box-shadow:0 22px 44px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.04)}
.display:before{content:"";position:absolute;inset:9px;border-radius:12px;background:linear-gradient(180deg,rgba(91,255,109,.12),rgba(15,126,47,.06));box-shadow:inset 0 0 22px rgba(28,255,86,.14)}
.time{position:relative;z-index:1;font-family:'Courier New',ui-monospace,monospace;font-size:50px;font-weight:900;letter-spacing:1px;color:#22ff45;text-shadow:0 0 8px rgba(34,255,69,.82),0 0 22px rgba(34,255,69,.45);font-variant-numeric:tabular-nums}
.hint{min-height:22px;color:#a9b8c3;font-size:14px;font-weight:800;text-align:center}
.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.action-btn{height:58px;border:0;border-radius:16px;font-size:17px;font-weight:950;cursor:pointer;transition:transform .1s ease,filter .1s ease}
.action-btn:active{transform:scale(.97)}
.primary{background:#ff6b35;color:#fff;box-shadow:0 12px 22px rgba(255,107,53,.28)}
.primary.running{background:#e83e36}
.secondary{background:#edf2f5;color:#1a2732}
@media (max-width:360px){
  .time{font-size:42px}
  .display{height:118px}
  .stage{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<header class="header">
  <button type="button" class="back-btn" aria-label="뒤로가기" onclick="goBack()">‹</button>
  <span class="header-title">스탑워치</span>
  <div class="header-spacer"></div>
</header>

<main class="stage">
  <section class="stopwatch-rig" aria-label="스탑워치">
    <div class="display-stand">
      <div class="display">
        <div class="time" id="timeText">00:00:00</div>
      </div>
    </div>
    <div class="hint" id="hintText">시작 버튼을 누르면 시간이 올라가요.</div>
    <div class="actions">
      <button type="button" class="action-btn primary" id="toggleBtn">시작</button>
      <button type="button" class="action-btn secondary" id="resetBtn">초기화</button>
    </div>
  </section>
</main>

<script>
let startTime = 0;
let elapsedBeforeStart = 0;
let rafId = null;
let isRunning = false;

const timeText = document.getElementById('timeText');
const hintText = document.getElementById('hintText');
const toggleBtn = document.getElementById('toggleBtn');
const resetBtn = document.getElementById('resetBtn');

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  const centiseconds = Math.floor((ms % 1000) / 10);
  return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}:${String(centiseconds).padStart(2,'0')}`;
}

function currentElapsed() {
  return isRunning ? elapsedBeforeStart + performance.now() - startTime : elapsedBeforeStart;
}

function render() {
  timeText.textContent = formatTime(currentElapsed());
  if (isRunning) rafId = requestAnimationFrame(render);
}

function startStopwatch() {
  if (isRunning) return;
  isRunning = true;
  startTime = performance.now();
  toggleBtn.textContent = '멈춰';
  toggleBtn.classList.add('running');
  hintText.textContent = '멈춰 버튼을 누르면 시간이 정지돼요.';
  render();
}

function stopStopwatch() {
  if (!isRunning) return;
  elapsedBeforeStart = currentElapsed();
  isRunning = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  toggleBtn.textContent = '시작';
  toggleBtn.classList.remove('running');
  hintText.textContent = '정지했어요. 다시 시작하면 이어서 재요.';
  render();
}

function resetStopwatch() {
  if (rafId) cancelAnimationFrame(rafId);
  isRunning = false;
  rafId = null;
  startTime = 0;
  elapsedBeforeStart = 0;
  toggleBtn.textContent = '시작';
  toggleBtn.classList.remove('running');
  hintText.textContent = '시작 버튼을 누르면 시간이 올라가요.';
  render();
}

function goBack() {
  if (window.parent) window.parent.postMessage({ type: 'exitPlay' }, '*');
}

toggleBtn.addEventListener('click', () => {
  if (isRunning) stopStopwatch();
  else startStopwatch();
});
resetBtn.addEventListener('click', resetStopwatch);

render();
</script>
</body>
</html>
