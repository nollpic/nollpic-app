<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도형주사위</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Pretendard',system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
body{display:flex;flex-direction:column;min-height:100%;background:#17172b;color:#fff}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.06);flex-shrink:0}
.back-btn{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:26px;font-weight:900;cursor:pointer}
.header-title{font-size:17px;font-weight:900}
.header-spacer{width:44px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 22px 18px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0,rgba(73,212,190,.18),transparent 42%),#17172b}
.dice-card{width:min(76vw,280px);aspect-ratio:1;border:0;border-radius:34px;background:linear-gradient(145deg,#fff,#e8fbf8);box-shadow:0 28px 58px rgba(0,0,0,.28),inset 0 -10px 0 rgba(16,119,111,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .18s ease}
.dice-card:active{transform:scale(.97)}
.shape{display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.18));transition:transform .22s ease,opacity .22s ease}
.shape.circle{width:42%;height:42%;border-radius:999px;background:linear-gradient(145deg,#ffdb61,#f3a81e)}
.shape.square{width:44%;height:44%;border-radius:22px;background:linear-gradient(145deg,#6ed6ff,#2f7df2)}
.shape.triangle{width:0;height:0;border-left:62px solid transparent;border-right:62px solid transparent;border-bottom:112px solid #ef5264}
.shape.star{width:45%;height:45%;background:linear-gradient(145deg,#b58cff,#7c4dff);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 35%)}
.shape.diamond{width:43%;height:43%;border-radius:18px;background:linear-gradient(145deg,#58e0c4,#12a695);transform:rotate(45deg)}
.rolling .shape{animation:spin .24s linear infinite}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:rgba(255,255,255,.44);font-size:13px;font-weight:800}
.control-bar{padding:12px 20px 18px;background:rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.08);display:grid;gap:10px;flex-shrink:0}
.shape-name{text-align:center;color:rgba(255,255,255,.82);font-size:16px;font-weight:900;min-height:22px}
.shape-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.shape-option{height:46px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
.shape-option:active{transform:scale(.96)}
.shape-option[aria-pressed="true"]{background:rgba(24,183,167,.18);border-color:rgba(24,183,167,.7);box-shadow:inset 0 0 0 1px rgba(24,183,167,.18)}
.picker-shape{display:block;filter:drop-shadow(0 5px 7px rgba(0,0,0,.15))}
.picker-shape.circle{width:20px;height:20px;border-radius:999px;background:#f3b92f}
.picker-shape.square{width:20px;height:20px;border-radius:6px;background:#3b82f6}
.picker-shape.triangle{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:22px solid #ef5264}
.picker-shape.star{width:22px;height:22px;background:#8b5cf6;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 35%)}
.picker-shape.diamond{width:19px;height:19px;border-radius:5px;background:#18b7a7;transform:rotate(45deg)}
.roll-btn{height:56px;border:0;border-radius:18px;background:#18b7a7;color:#fff;font-size:19px;font-weight:1000;cursor:pointer;box-shadow:0 14px 28px rgba(24,183,167,.28)}
.roll-btn:active{transform:scale(.98)}
@keyframes spin{to{transform:rotate(360deg) scale(.9)}}
@media (max-width:360px){
  .shape.triangle{border-left-width:52px;border-right-width:52px;border-bottom-width:94px}
  .dice-card{border-radius:28px}
  .shape-picker{gap:6px}
  .shape-option{height:42px;border-radius:14px}
}
</style>
</head>
<body>
<header class="header">
  <button type="button" class="back-btn" aria-label="뒤로가기" onclick="goBack()">‹</button>
  <span class="header-title">🔷 도형주사위</span>
  <div class="header-spacer"></div>
</header>

<main class="stage">
  <button type="button" class="dice-card" id="shapeDice" aria-label="도형 굴리기" onclick="rollShape()">
    <span class="shape circle" id="shapeResult"></span>
  </button>
  <p class="hint">탭해서 굴리기</p>
</main>

<div class="control-bar">
  <div class="shape-name" id="shapeName">동그라미</div>
  <div class="shape-picker" aria-label="사용할 도형 선택" id="shapePicker"></div>
  <button type="button" class="roll-btn" onclick="rollShape()">굴리기 🔷</button>
</div>

<script>
const shapes=[
  {key:'circle',label:'동그라미'},
  {key:'triangle',label:'세모'},
  {key:'square',label:'네모'},
  {key:'star',label:'별'},
  {key:'diamond',label:'마름모'}
];
const dice=document.getElementById('shapeDice');
const shapeEl=document.getElementById('shapeResult');
const shapeName=document.getElementById('shapeName');
const shapePicker=document.getElementById('shapePicker');
const selectedShapes=new Set(['circle','triangle']);
let rolling=false;

function getActiveShapes(){
  return shapes.filter(item=>selectedShapes.has(item.key));
}

function setShape(item){
  shapeEl.className=`shape ${item.key}`;
  shapeName.textContent=item.label;
}

function renderPicker(){
  shapePicker.innerHTML=shapes.map(item=>`
    <button type="button" class="shape-option" aria-pressed="${selectedShapes.has(item.key)}" aria-label="${item.label}" data-shape="${item.key}">
      <span class="picker-shape ${item.key}" aria-hidden="true"></span>
    </button>
  `).join('');
}

function toggleShape(key){
  if(selectedShapes.has(key)){
    if(selectedShapes.size===1)return;
    selectedShapes.delete(key);
  }else{
    selectedShapes.add(key);
  }
  renderPicker();
  if(!selectedShapes.has(shapeEl.className.replace('shape ',''))){
    setShape(getActiveShapes()[0]);
  }
}

function rollShape(){
  if(rolling)return;
  const active=getActiveShapes();
  rolling=true;
  dice.classList.add('rolling');
  let ticks=0;
  const timer=setInterval(()=>{
    setShape(active[Math.floor(Math.random()*active.length)]);
    ticks+=1;
    if(ticks>=12){
      clearInterval(timer);
      setShape(active[Math.floor(Math.random()*active.length)]);
      dice.classList.remove('rolling');
      rolling=false;
    }
  },70);
}

shapePicker.addEventListener('click',(event)=>{
  const button=event.target.closest('.shape-option');
  if(!button || rolling)return;
  toggleShape(button.dataset.shape);
});

renderPicker();

function goBack(){
  if(window.parent)window.parent.postMessage({type:'exitPlay'},'*');
}
</script>
</body>
</html>
