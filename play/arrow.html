<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>화살표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;height:100dvh;background:#0E1D3E;color:#fff;transition:background 0.35s ease;}

.header{display:flex;align-items:center;justify-content:space-between;padding:0 1rem;height:52px;flex-shrink:0;background:rgba(255,255,255,0.06);}
.back-btn{background:none;border:none;color:#fff;font-size:1.3rem;font-weight:700;cursor:pointer;padding:0.5rem 0.75rem;}
.header-title{font-size:1rem;font-weight:800;}
.header-spacer{width:52px;}

/* 메인 스테이지 */
.stage{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:1.25rem;
    position:relative;overflow:hidden;
}

/* 화살표 */
.arrow-display{
    font-size:52vw;line-height:1;font-weight:900;
    animation:arrowIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    filter:drop-shadow(0 6px 24px rgba(0,0,0,0.3));
    text-shadow:
        0.025em 0 0 currentColor,
        -0.025em 0 0 currentColor,
        0 0.025em 0 currentColor,
        0 -0.025em 0 currentColor;
    user-select:none;
}
@keyframes arrowIn{
    from{transform:scale(0.4) rotate(-15deg);opacity:0;}
    to{transform:scale(1) rotate(0deg);opacity:1;}
}

.dir-label{
    font-size:1.6rem;font-weight:900;letter-spacing:0.06em;
    opacity:0.9;
    animation:fadeUp 0.3s ease 0.1s both;
}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* 대기 화면 */
.idle-msg{font-size:0.95rem;color:rgba(255,255,255,0.35);font-weight:600;text-align:center;line-height:1.7;}

/* 하단 버튼 */
.bottom-bar{flex-shrink:0;padding:0.75rem 1.25rem 1.5rem;display:flex;flex-direction:column;gap:10px;}
.stop-btn{
    width:100%;padding:1rem;
    background:#e74c3c;border:none;border-radius:1rem;
    color:#fff;font-size:1.05rem;font-weight:900;cursor:pointer;
    box-shadow:0 4px 20px rgba(231,76,60,0.45);
    transition:transform 0.1s,opacity 0.15s;
    display:none;
}
.stop-btn:active{transform:scale(0.97);}
.start-btn{
    width:100%;padding:1rem;
    background:#FF6B00;border:none;border-radius:1rem;
    color:#fff;font-size:1.05rem;font-weight:900;cursor:pointer;
    box-shadow:0 4px 20px rgba(255,107,0,0.45);
    transition:transform 0.1s;
}
.start-btn:active{transform:scale(0.97);}

/* 결과 고정 상태 */
.frozen .arrow-display{animation:none;}
</style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="goBack()">❮</button>
    <span class="header-title">🏹 화살표</span>
    <div class="header-spacer"></div>
</header>

<div class="stage" id="stage">
    <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div id="mainDisplay">
        <p class="idle-msg">시작을 누르면<br>1초마다 방향이 바뀌어요</p>
    </div>
</div>

<div class="bottom-bar">
    <button class="stop-btn"  id="stopBtn"  onclick="stopArrow()">멈춰! ✋</button>
    <button class="start-btn" id="startBtn" onclick="startArrow()">시작하기</button>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function getACtx(){ if(!actx) actx = new AudioCtx(); return actx; }

function playSwish(dir){
    const ctx = getACtx();
    // 빠른 스윗 노이즈
    const dur = 0.18;
    const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));
    const src = ctx.createBufferSource(); src.buffer=buf;
    const hpf = ctx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=800;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    src.connect(hpf); hpf.connect(g); g.connect(ctx.destination);
    src.start(); src.stop(ctx.currentTime+dur);
}

function playStop(){
    const ctx = getACtx();
    [0,0.08].forEach((t,i)=>{
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type='sine'; osc.frequency.value = i===0?600:480;
        g.gain.setValueAtTime(0.28, ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.2);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.2);
    });
}

const COLORS = {
    left:  { bg:'#1a3a6e', accent:'#5AAFFF' },
    right: { bg:'#3d1a0e', accent:'#FF8C42' },
};

const INTERVAL_MS = 2000;
const CYCLE_SIZE = 20;
const DIRECTIONS_PER_SIDE = CYCLE_SIZE / 2;
let arrowTimer = null;
let timerAnim  = null;
let isRunning  = false;
let directionQueue = [];

function countDirection(queue, dir){
    return queue.filter(item=>item===dir).length;
}

function getMaxRun(queue){
    let maxRun = 1;
    let run = 1;
    for(let i=1;i<queue.length;i++){
        run = queue[i]===queue[i-1] ? run+1 : 1;
        maxRun = Math.max(maxRun, run);
    }
    return maxRun;
}

function getMaxAlternatingRun(queue){
    let maxRun = 1;
    let run = 1;
    for(let i=1;i<queue.length;i++){
        run = queue[i]!==queue[i-1] ? run+1 : 1;
        maxRun = Math.max(maxRun, run);
    }
    return maxRun;
}

function hasBalancedWindows(queue){
    for(let i=0;i<=queue.length-6;i++){
        const chunk = queue.slice(i, i+6);
        const leftCount = countDirection(chunk, 'left');
        if(leftCount<2 || leftCount>4) return false;
    }
    return true;
}

function hasPattern(queue, pattern){
    for(let i=0;i<=queue.length-pattern.length;i++){
        if(pattern.every((dir, idx)=>queue[i+idx]===dir)) return true;
    }
    return false;
}

function shuffleDirections(){
    const queue = [];
    for(let i=0;i<DIRECTIONS_PER_SIDE;i++){
        queue.push('left', 'right');
    }

    for(let i=queue.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    return queue;
}

function buildDirectionQueue(){
    for(let attempt=0;attempt<800;attempt++){
        const queue = shuffleDirections();
        if(
            getMaxRun(queue)<=2 &&
            getMaxAlternatingRun(queue)<=6 &&
            hasBalancedWindows(queue) &&
            hasPattern(queue, ['left', 'left', 'right']) &&
            hasPattern(queue, ['right', 'right', 'left'])
        ){
            return queue;
        }
    }

    return [
        'left', 'left', 'right', 'left', 'right',
        'right', 'left', 'right', 'left', 'left',
        'right', 'right', 'left', 'right', 'left',
        'left', 'right', 'left', 'right', 'right'
    ];
}
function nextDirection(){
    if(directionQueue.length===0) directionQueue = buildDirectionQueue();
    return directionQueue.shift();
}

function startArrow(){
    isRunning = true;
    directionQueue = buildDirectionQueue();
    document.getElementById('stopBtn').style.display  = 'block';
    document.getElementById('startBtn').style.display = 'none';
    showArrow();
    scheduleNext();
}

function scheduleNext(){
    if(arrowTimer) clearTimeout(arrowTimer);
    arrowTimer = setTimeout(()=>{
        if(!isRunning) return;
        showArrow();
        scheduleNext();
    }, INTERVAL_MS);
    animateTimerBar();
}

function animateTimerBar(){
    const bar = document.getElementById('timerBar');
    if(timerAnim) cancelAnimationFrame(timerAnim);
    const start = performance.now();
    function frame(now){
        const p = Math.min((now-start)/INTERVAL_MS, 1);
        bar.style.width = ((1-p)*100)+'%';
        if(p<1 && isRunning) timerAnim = requestAnimationFrame(frame);
        else if(!isRunning) bar.style.width='100%';
    }
    timerAnim = requestAnimationFrame(frame);
}

function showArrow(){
    const dir = nextDirection();
    const arrow = dir==='left'?'←':'→';
    const label = dir==='left'?'':'';
    const col = COLORS[dir];

    document.body.style.background = col.bg;

    const display = document.getElementById('mainDisplay');
    display.innerHTML = `
        <div class="arrow-display">${arrow}</div>
        <div class="dir-label" style="color:${col.accent};">${label}</div>
    `;
    playSwish(dir);
}

function stopArrow(){
    isRunning = false;
    if(arrowTimer) clearTimeout(arrowTimer);
    if(timerAnim)  cancelAnimationFrame(timerAnim);
    document.getElementById('timerBar').style.width='100%';

    playStop();

    document.getElementById('stopBtn').style.display  = 'none';
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('startBtn').textContent   = '다시 시작';
}

function goBack(){ window.parent.postMessage({ type:'exitPlay' }, '*'); }
</script>
</body>
</html>
