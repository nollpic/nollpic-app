<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>놀픽 미션 기록 마이페이지</title>
  <link rel="stylesheet" href="mypage-result.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-device nav-visible">
    <main class="app">

<section class="complete-hero">

  <div class="complete-text">
    <h1>미션 완료! 🎉</h1>
    <p>
      오늘도 뇌 탐험 성공!<br>
      5가지 활동 결과가 저장되었어요.
    </p>
  </div>
</section>

<section class="child-card child-select-card result-child-picker">
  <div class="result-child-title">
    <span>아이 선택</span>
  </div>

  <select id="child-selector" class="child-selector result-child-selector" aria-label="아이 선택"></select>

  <strong id="child-name" class="visually-hidden">김놀픽 · 초2</strong>
</section>

    <section class="latest-card">
      <div class="section-head">
        <h2>최근 미션 결과</h2>
        <span id="latest-date">2026.06.01</span>
      </div>

      <div class="score-summary">
        <div>
          <span>종합 결과</span>
          <strong id="overall-score">82</strong>
        </div>
        <p id="overall-comment">지난 기록보다 7점 좋아졌어요.</p>
      </div>

      <div id="ability-list" class="ability-list"></div>

    <div class="share-buttons">
      <button class="share-main-btn" onclick="shareResult()">
       결과 공유하기
      </button>
    </div>
    </section>

    <section class="history-card">
      <button class="accordion-btn" onclick="toggleHistory()">
        <div>
          <h2>과거 데이터 보기</h2>
          <span>이전 미션 기록을 영역별로 확인해요</span>
        </div>
        <span class="accordion-icon" id="accordion-icon"></span>
      </button>

      <div id="history-panel" class="history-panel">
        <div class="growth-card">
          <div class="growth-head">
            <div>
              <h3>📈 성장 그래프</h3>
              <p id="growth-summary">최근 기록의 변화 흐름을 확인해요</p>
            </div>
            <span id="growth-badge">성장중</span>
          </div>
          <div class="growth-chart-wrap">
            <canvas id="growthChart"></canvas>
          </div>
        </div>

        <div id="history-list" class="history-list"></div>
      </div>
    </section>

    <section class="analysis-card">
      <h2>놀픽 분석</h2>
      <p id="analysis-text"></p>
    </section>

    <p class="disclaimer">
      본 결과는 놀이형 인지 활동의 수행 기록이며, <br>의료적 진단 또는 치료 목적의 검사가 아닙니다.
    </p>
  </main>

  <nav class="bottom-tab-nav" aria-label="하단 메뉴">
    <button type="button" class="bottom-tab" onclick="location.href='../index.html'">
      <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 9.5L12 3L21 9.5V20C21 20.552 20.552 21 20 21H15V15H9V21H4C3.448 21 3 20.552 3 20V9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span>홈</span>
    </button>
    <button type="button" class="bottom-tab active" onclick="location.href='mypage-result.html'">
      <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7 15V17M12 11V17M17 7V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>미션결과</span>
    </button>
    <button type="button" class="bottom-tab" onclick="location.href='../index.html?page=mypage'">
      <svg class="bottom-tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 20C4 17 7.582 15 12 15C16.418 15 20 17 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>마이</span>
    </button>
  </nav>

  </div><!-- /.app-device -->

  <script src="mypage-result.js"></script>
  <script type="module" src="../firebase-save-result.js"></script>

</body>
</html>
